<!doctype html><html><head><meta charset="utf-8">
<title>SPECTRA UI mockups — the approved design, frames only</title>
<!--
  THE DESIGN OF RECORD, frames only.

  Derived MECHANICALLY (never retyped) from the Admiral-approved artifact
  data/ui-layout-plan/explainer-final.html in the fleet-spotfx home — the
  one he edited and said "it's ready to build". Its <style> block (the
  `.sp` rules every mockup is drawn with) and its <script> block (the real
  song data and the DOM builders that populate each frame) are copied
  VERBATIM; what is dropped is the explainer's own prose and its embedded
  base64 screenshots of the OLD live app, neither of which is part of the
  design.

  It lives in the repo so scripts/check_ui_fidelity.py — the design-
  fidelity gate — can render the approved frames beside the live chrome
  with no dependency on a path outside this checkout. The gate still
  PREFERS the fleet copy when it is present, so firstmate's own artifact
  stays authoritative; this is the fallback and the frozen reference.

  Regenerate (only when he approves a new artifact):
    python3 scripts/regenerate_ui_mockups.py
-->
<style>
/* ── Explainer chrome (light + dark). The MOCKUPS below always render in
   Spectra's own tokens: Spectra is a dark-only, purple-on-black app. ── */
:root {
  --d-bg:#f6f4fa; --d-fg:#1b1229; --d-muted:#5d5276; --d-card:#ffffff; --d-line:#e1dbee;
  --d-accent:#7c3aed; --d-accent2:#a21caf; --d-warn:#a15c07; --d-ok:#15803d; --d-soft:#efeaf8;
  --d-shadow: 0 1px 2px rgba(30,10,60,.06), 0 8px 24px rgba(30,10,60,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --d-bg:#07040d; --d-fg:#ece7f7; --d-muted:#9d8fbb; --d-card:#120b1c; --d-line:#2e2045;
    --d-accent:#a855f7; --d-accent2:#e879f9; --d-warn:#e0b257; --d-ok:#4ade80; --d-soft:#1a1128;
    --d-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --d-bg:#07040d; --d-fg:#ece7f7; --d-muted:#9d8fbb; --d-card:#120b1c; --d-line:#2e2045;
  --d-accent:#a855f7; --d-accent2:#e879f9; --d-warn:#e0b257; --d-ok:#4ade80; --d-soft:#1a1128;
  --d-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--d-bg); color: var(--d-fg); font: 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; overflow-x: hidden; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 80px; }
h1 { font-size: 30px; line-height: 1.15; margin: 4px 0 10px; letter-spacing: -.01em; }
h2 { font-size: 22px; margin: 56px 0 6px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 26px 0 6px; }
p { margin: 8px 0; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--d-accent); font-weight: 700; }
.lede { font-size: 17px; color: var(--d-fg); max-width: 860px; }
.muted { color: var(--d-muted); }
.small { font-size: 13px; }
code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--d-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--d-accent); }
.topbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.themebtn { border: 1px solid var(--d-line); background: var(--d-card); color: var(--d-fg); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.toc a { font-size: 13px; text-decoration: none; border: 1px solid var(--d-line); background: var(--d-card); padding: 4px 10px; border-radius: 999px; color: var(--d-fg); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--d-card); border: 1px solid var(--d-line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--d-shadow); min-width: 0; }
.card h4 { margin: 0 0 4px; font-size: 14px; }
.card p { font-size: 14px; }
.big { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--d-line); color: var(--d-muted); }
.pill.ok { color: var(--d-ok); border-color: currentColor; }
.pill.warn { color: var(--d-warn); border-color: currentColor; }
.pill.acc { color: var(--d-accent); border-color: currentColor; }
figure { margin: 18px 0; }
figcaption { font-size: 13px; color: var(--d-muted); margin-top: 6px; }
.shot { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--d-line); }
.shotbox { overflow: hidden; border-radius: 8px; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; }
.tag.before { background: rgba(217,164,65,.16); color: var(--d-warn); }
.tag.after { background: rgba(74,222,128,.14); color: var(--d-ok); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--d-line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--d-muted); }
.tablebox { overflow-x: auto; border: 1px solid var(--d-line); border-radius: 10px; background: var(--d-card); }
.tablebox table td:first-child { font-weight: 600; }
ol.qs { padding-left: 22px; }
ol.qs li { margin: 10px 0; }
.q { font-weight: 700; }
.rec { color: var(--d-ok); font-weight: 600; }
.callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.co { border-left: 3px solid var(--d-accent); padding: 4px 10px; font-size: 13.5px; background: var(--d-card); border-radius: 0 8px 8px 0; }
.co b { display: block; font-size: 13px; }
.phase { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--d-line); }
.phase .n { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; background: var(--d-soft); color: var(--d-accent); }
.phase.first .n { background: var(--d-accent); color: #fff; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.controls button { border: 1px solid var(--d-line); background: var(--d-card); color: var(--d-fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.controls button.on { border-color: var(--d-accent); color: var(--d-accent); font-weight: 600; }
.controls .ro { font-size: 12.5px; color: var(--d-muted); font-variant-numeric: tabular-nums; }

/* ── Frames: a mockup at its TRUE width, scaled to fit the column. ── */
.fw { position: relative; width: 100%; border-radius: 10px; border: 1px solid var(--d-line); background: #05030a; overflow: hidden; }
.fw .frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.fw.native { overflow-x: auto; overflow-y: hidden; }
.fw.native .frame { position: relative; transform: none !important; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
.fhead .lbl { font-size: 12.5px; font-weight: 700; color: var(--d-muted); }
.fhead button { border: 1px solid var(--d-line); background: var(--d-card); color: var(--d-fg); border-radius: 6px; font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer; }

/* ═══════════ SPECTRA MOCKUP STYLES (its real tokens) ═══════════ */
.sp {
  --bg:#0a0612; --surface:#140d1f; --surface2:#1f1430; --border:#372552; --accent:#a855f7; --accent2:#e879f9;
  --text:#ece7f7; --text-muted:#9585b5; --danger:#f87171; --ok:#4ade80; --warning:#d9a441; --radius:8px;
  --scene:#22d3ee; --flare:#a3e635; --charge:#fbbf24; --lull:#38bdf8; --drop:#ec4899; --hi:#f5f5f4; --lo:#818cf8;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); background: var(--bg);
  font-size: 15px; line-height: 1.3; container-type: inline-size; container-name: sp; position: relative;
}
.sp * { box-sizing: border-box; }
.sp svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sp .num { font-variant-numeric: tabular-nums; }
/* NAV */
.sp .nav { display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 6; }
.sp .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: .14em; color: var(--accent); margin-right: 14px; white-space: nowrap; }
.sp .logo .gem { width: 14px; height: 14px; background: var(--accent); transform: rotate(45deg); border-radius: 2px; flex: none; }
.sp .ni { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; user-select: none; }
.sp .ni:hover { color: var(--text); }
.sp .ni.active { background: var(--surface2); color: var(--text); }
.sp .ni.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--accent); }
.sp .ni .caret { width: 12px; height: 12px; opacity: .7; transition: transform .15s; }
.sp .ni.open .caret { transform: rotate(180deg); }
.sp .ni.open { background: var(--surface2); color: var(--text); }
.sp .grow { flex: 1; }
.sp .q { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); color: var(--text-muted); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sp .menu { position: absolute; top: 40px; left: 0; min-width: 236px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.55); padding: 6px; z-index: 30; display: none; }
.sp .ni.open .menu { display: block; }
.sp .menu .mi { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 13px; font-weight: 500; }
.sp .menu .mi svg.i { color: var(--text-muted); }
.sp .menu .mi:hover { background: var(--surface2); }
.sp .menu .mi.cur { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
.sp .menu .mi.cur svg.i { color: var(--accent); }
.sp .menu .mi .h { margin-left: auto; color: var(--text-muted); font-size: 11px; font-weight: 400; }
.sp .menu .mhd { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); padding: 6px 10px 4px; }
.sp.touch .menu .mi { height: 46px; font-size: 14px; }
.sp.touch .ni { height: 40px; }

/* GLOBAL TIMELINE ROW */
.sp .tl { display: grid; grid-template-columns: 220px minmax(0, 1fr) 96px 100px; align-items: center; gap: 14px; height: 53px; padding: 0 16px; background: linear-gradient(180deg, var(--surface), #100a19); border-bottom: 1px solid var(--border); position: relative; z-index: 4; }
.sp .song { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; cursor: pointer; }
.sp .eq { width: 16px; height: 14px; display: flex; gap: 2px; align-items: flex-end; }
.sp .eq i { display: block; width: 4px; background: var(--accent); border-radius: 1px; animation: speq 0.9s ease-in-out infinite alternate; }
.sp .eq i:nth-child(2) { animation-delay: -.3s; } .sp .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes speq { from { height: 3px; } to { height: 14px; } }
.sp .song .t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .song .a { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .track { position: relative; height: 39px; min-width: 0; }
.sp .track > svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
.sp .nx { position: relative; overflow: hidden; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 8px; height: 39px; padding: 0 10px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--border); transition: border-color .2s, box-shadow .2s; min-width: 0; }
.sp .nx > * { position: relative; }
.sp .nx > .fill { position: absolute; inset: 0; background: #3a2858; transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; }
.sp .nx:not(.soon) > .fill { transform: scaleX(0) !important; }
.sp .nx .ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.sp .nx .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.sp .nx .c { display: block; width: 4.4ch; text-align: right; font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: -.01em; white-space: nowrap; }
.sp .nx .c small { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-left: 1px; }
.sp .nx.soon { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2), 0 0 16px rgba(232,121,249,.35); }
.sp .nx.soon .c { color: #fff; }
.sp .nx.hit { animation: sphit .45s ease-out; }
@keyframes sphit { 0% { box-shadow: 0 0 0 2px #fff, 0 0 26px rgba(255,255,255,.7); } 100% { box-shadow: 0 0 0 0 transparent; } }
.sp .clk { font-size: 13px; color: var(--text-muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sp .clk b { color: var(--text); font-weight: 650; }
.sp .mk { transition: opacity .3s; }
.sp .mk.past { opacity: .28 !important; }
.sp .ring { animation: spring 1.3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spring { 0% { opacity: .95; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.5); } }

/* CONSOLIDATED BAR */
.sp .bar { display: flex; align-items: center; gap: 7px; height: 48px; padding: 0 16px; background: var(--surface2); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.sp .ib { position: relative; width: 36px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; flex: none; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.sp .ib svg.i { width: 18px; height: 18px; }
.sp .sepv { width: 1px; height: 24px; background: var(--border); flex: none; margin: 0 2px; }
.sp .house { color: var(--accent2); border-color: var(--accent); }
.sp .house.off { color: var(--text-muted); border-color: var(--border); opacity: .7; }
.sp .house .bdg { position: absolute; right: -4px; bottom: -4px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent2); display: flex; align-items: center; justify-content: center; }
.sp .house .bdg svg.i { width: 9px; height: 9px; stroke-width: 2.6; }
.sp .house .holdring { position: absolute; inset: -4px; pointer-events: none; }
.sp .dm { border: 2px solid var(--accent); }
.sp .dm .disc { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text); background: linear-gradient(90deg, var(--text) 50%, transparent 50%); }
.sp .dm.dark .disc { background: #000; border-color: var(--text-muted); }
.sp .dm.light .disc { background: #fff; }
.sp .hue.off { opacity: .5; filter: grayscale(1); }
.sp .nb { flex: 0 1 156px; min-width: 96px; height: 34px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: center; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); position: relative; cursor: pointer; }
.sp .nb .lab, .sp .nb .n { display: block; }
.sp .nb { min-width: 0; }
.sp .nb .lab { font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); line-height: 1; }
.sp .nb .n { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.sp .nb .lock { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--accent2); color: var(--accent2); display: flex; align-items: center; justify-content: center; }
.sp .nb .lock svg.i { width: 9px; height: 9px; }
.sp .nb.forced { border-color: var(--accent2); }
.sp .nb.noi { grid-template-columns: minmax(0, 1fr) !important; }
.sp .grad { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #22d3ee, #0ea5e9 45%, #1e3a8a); border: 1px solid rgba(255,255,255,.25); }
.sp .en { flex: none; width: 110px; height: 34px; display: grid; grid-template-columns: 14px 40px 34px; gap: 6px; align-items: center; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
.sp .en svg.i { width: 14px; height: 14px; color: var(--warning); }
.sp .meter { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.sp .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .4s; }
.sp .en .v { font-size: 12.5px; color: var(--text); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.sp .mark { flex: none; width: 48px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sp .mark small { font-size: 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 600; line-height: 1; }
.sp .show { flex: 0 1 316px; min-width: 136px; height: 34px; display: grid; grid-template-columns: 18px minmax(0, 1fr) 12px minmax(0, .82fr); gap: 7px; align-items: center; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; position: relative; }
.sp .show > .si { color: var(--accent2); display: flex; position: relative; }
.sp .show { isolation: isolate; }
.sp .show > .fill { position: absolute; inset: 0; z-index: -1; border-radius: 8px; background: #2c1d44; clip-path: inset(0 100% 0 0 round 8px); pointer-events: none; }
.sp .show > .si .cnt { position: absolute; top: -8px; right: -9px; min-width: 14px; height: 14px; border-radius: 7px; background: var(--accent); color: #14061f; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.sp .act { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: center; min-width: 0; }
.sp .act .tg { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: var(--surface2); border: 1px solid var(--border); }
.sp .act .tg svg.i { width: 11px; height: 11px; stroke-width: 2.4; }
.sp .act .tx { min-width: 0; line-height: 1.15; }
.sp .act .nm { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.sp .act .wh { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-variant-numeric: tabular-nums; }
.sp .act .wh[data-showwhen] { font-size: 12.5px; font-weight: 750; color: var(--text); letter-spacing: -.01em; }
.sp .act .wh small { font-size: 9px; font-weight: 600; color: var(--text-muted); margin-left: 1px; }
.sp .act.cur .tg { border-color: var(--accent2); color: var(--accent2); }
.sp .act.nxt { opacity: .78; }
.sp .show .chev { color: var(--text-muted); display: flex; }
.sp .show .chev svg.i { width: 12px; height: 12px; }
.sp .show.idle { grid-template-columns: 18px minmax(0, 1fr); }
.sp .pv { flex: none; display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 6px 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.sp .pv .sw { width: 16px; height: 16px; border-radius: 4px; background: #333; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.sp .pv .pp { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-left: 2px; }
.sp .pv .pp svg.i { width: 12px; height: 12px; }
.sp .pv.open { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.sp .alert { flex: none; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--warning); color: #fde68a; background: rgba(217,164,65,.14); font-size: 12px; font-weight: 700; cursor: pointer; }

  $$('[data-meter]').forEach((e) => { e.style.width = Math.round(Math.max(0.15, sec[2]) * 100) + '%'; });
  const nScene = SCENES.find((s) => s[0] > pos);
  const when = { high: CUES.high > pos ? cd(CUES.high - pos) : '—', low: CUES.low > pos ? cd(CUES.low - pos) : '—', scene: nScene ? cd(nScene[0] - pos) : '—' };
  $$('[data-showwhen]').forEach((e) => { const h = when[e.dataset.showwhen]; if (h !== undefined && e.innerHTML !== h) e.innerHTML = h; });
  $$('[data-showfill]').forEach((f) => { const w = f.parentNode.querySelector('.act.cur [data-showwhen]'); const k = w && w.dataset.showwhen; const t = k === 'high' ? CUES.high - pos : k === 'low' ? CUES.low - pos : (k === 'scene' && nScene) ? nScene[0] - pos : -1; const p = t >= 0 && t <= 10000 ? 1 - t / 10000 : 0; f.style.clipPath = `inset(0 ${(100 - p * 100).toFixed(2)}% 0 0 round 8px)`; });
  requestAnimationFrame(loop);
}

/* ═══════════════════ controls ═══════════════════ */
function controls() {
  $$('#simctl [data-speed]').forEach((b) => b.addEventListener('click', () => { clock.speed = Number(b.dataset.speed); $$('#simctl [data-speed]').forEach((x) => x.classList.toggle('on', x === b)); }));
  $('#simctl [data-jump]').addEventListener('click', () => { const nx = events().find((e) => e.ms > clock.pos + 5200); if (nx) clock.pos = nx.ms - 5000; else clock.pos = 15000; });
  $('#simctl [data-drop]').addEventListener('click', (e) => { dropConfirmed = !dropConfirmed; e.target.classList.toggle('on', dropConfirmed); e.target.textContent = dropConfirmed ? 'Drop 1: shown confirmed' : 'Drop 1: suggested (real state)'; tracks.forEach((t) => { if (!t.el.isConnected) return; const nt = buildTrack(t.el, { editable: t.editable }); Object.assign(t, { played: nt.played, ph: nt.ph, ringg: nt.ringg, ring: nt.ring, marks: nt.marks, X: nt.X, win: nt.win, wl: nt.wl, wr: nt.wr }); }); });
  $('#homectl [data-follow]').addEventListener('click', () => setFollow(true));
  $('#homectl [data-full]').addEventListener('click', () => { setFollow(false); home.win = { start: 0, end: SONG.dur }; });
  $$('[data-native]').forEach((b) => b.addEventListener('click', () => { const fw = b.closest('.fhead').nextElementSibling; fw.classList.toggle('native'); b.textContent = fw.classList.contains('native') ? 'Fit' : '1:1'; fit(); }));
  const tb = $('#themeBtn'); const modes = ['auto', 'light', 'dark']; let mi = 0;
  tb.addEventListener('click', () => { mi = (mi + 1) % 3; const m = modes[mi]; if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m); tb.textContent = 'Theme: ' + m; });
}
build(); controls();
window.addEventListener('resize', fit);
let lastW = 0;
if ('ResizeObserver' in window) new ResizeObserver(() => { const w = document.documentElement.clientWidth; if (w === lastW) return; lastW = w; requestAnimationFrame(fit); }).observe(document.documentElement);
requestAnimationFrame((t) => { clock.last = t; requestAnimationFrame(loop); });
</script>
