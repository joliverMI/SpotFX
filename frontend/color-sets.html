<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotFX — Color Sets</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .cs-row { display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius); cursor:pointer; }
    .cs-row:hover { background:var(--surface2); }
    .cs-row.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:7px; }
    .editor { display:none; }
    .editor.open { display:block; }
    .cs-entry, .cs-member { background:var(--surface2); padding:8px; border-radius:var(--radius); margin-bottom:8px; }
    .cs-entry-head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .cs-sub { font-size:11px; color:var(--text-muted); }
    .badge { font-size:10px; padding:2px 6px; border-radius:10px; }
    .badge-set   { background:rgba(33,150,243,0.15); color:#64b5f6; }
    .badge-group { background:rgba(156,39,176,0.15); color:#ba68c8; }
    .swatch { width:18px; height:18px; border-radius:4px; border:1px solid var(--border); flex-shrink:0; }
    #import-modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:1000; }
    #import-modal.open { display:flex; }
    .modal-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; max-width:420px; width:90vw; max-height:80vh; overflow-y:auto; }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="nav-root"></div>

  <main>
    <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;">
      <!-- ── Card list ─────────────────────────────────────────────────── -->
      <div class="card" style="min-width:0;max-height:calc(100vh - 80px);display:flex;flex-direction:column;">
        <div class="card-title" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          Color Sets
          <button class="btn-sm" id="btn-import" style="margin-left:auto" title="Import current colors from LedFX devices">⤓ Import</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="btn-sm btn-accent" id="btn-new-set">+ Set</button>
          <button class="btn-sm btn-accent" id="btn-new-group">+ Group</button>
        </div>
        <div class="field">
          <input id="cs-search" type="text" placeholder="Search…">
        </div>
        <div id="cs-list" style="overflow-y:auto;flex:1;min-height:0;"></div>
      </div>

      <!-- ── Editor ────────────────────────────────────────────────────── -->
      <div class="card editor" id="editor" style="max-height:calc(100vh - 80px);overflow-y:auto;">
        <div class="card-title" id="editor-title">Edit</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <button class="btn-accent" id="btn-save">Save</button>
          <button class="btn-danger btn-sm" id="btn-delete">Delete</button>
          <button class="btn-sm" id="btn-duplicate">Duplicate</button>
          <button class="btn-sm" id="btn-preview" style="margin-left:auto" title="Apply now to LedFX">▶ Preview</button>
        </div>
        <div class="field">
          <label>Name</label>
          <input id="c-name" type="text" placeholder="Color Set name">
        </div>
        <div class="field" style="display:flex;gap:12px;align-items:flex-end;">
          <div>
            <label>Marker Color</label>
            <input type="color" id="c-color" value="#FFD700" style="width:48px;height:34px;padding:2px;">
          </div>
          <div style="flex:1">
            <label>Labels (comma separated)</label>
            <input id="c-labels" type="text" placeholder="e.g. warm, drop">
          </div>
        </div>

        <!-- Set editor -->
        <div id="set-section" style="display:none">
          <div class="card-title" style="margin-top:8px;">
            Entries
            <span class="cs-sub" style="font-weight:400;margin-left:6px;">FG / BG color per device or category</span>
            <button class="btn-sm" id="btn-add-entry" style="margin-left:auto;">+ Entry</button>
          </div>
          <div id="entry-list"></div>
        </div>

        <!-- Group editor -->
        <div id="group-section" style="display:none">
          <div class="card-title" style="margin-top:8px;">Group Settings</div>
          <div class="field" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
            <label style="font-size:12px;">Default mode
              <select id="g-mode" style="margin-left:4px;">
                <option value="cycle">Cycle (sequential)</option>
                <option value="weighted">Weighted random</option>
              </select>
            </label>
            <label style="font-size:12px;">Cycle behaviour
              <select id="g-cycle-behavior" style="margin-left:4px;">
                <option value="wrap">Wrap (back to top)</option>
                <option value="bounce">Bounce (reverse at ends)</option>
              </select>
            </label>
            <label style="font-size:12px;display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="g-exclude-current"> Exclude current from next
            </label>
          </div>
          <div class="card-title" style="margin-top:8px;">
            Members
            <span class="cs-sub" style="font-weight:400;margin-left:6px;">ordered for cycle; weighted for random</span>
            <button class="btn-sm" id="btn-add-member" style="margin-left:auto;">+ Member</button>
          </div>
          <div id="member-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Import modal -->
<div id="import-modal">
  <div class="modal-card">
    <div class="card-title">Import colors from LedFX</div>
    <p class="cs-sub">Select which devices to read. Their current FG/BG colors and background mode become a new Color Set.</p>
    <div id="import-device-list" style="margin:10px 0;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn-sm" id="btn-import-cancel">Cancel</button>
      <button class="btn-sm btn-accent" id="btn-import-go">Import</button>
    </div>
  </div>
</div>

<!-- Gradient editor modal -->
<div id="grad-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;">
  <div class="modal-card">
    <div class="card-title">Edit Gradient</div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="grad-name" placeholder="e.g. Red to Blue">
    </div>
    <div class="field">
      <label>Direction</label>
      <select id="grad-dir">
        <option value="90">→ Horizontal (90°)</option>
        <option value="0">↑ Vertical (0°)</option>
        <option value="45">↘ Diagonal (45°)</option>
        <option value="135">↙ Diagonal (135°)</option>
        <option value="180">← Reverse (180°)</option>
      </select>
    </div>
    <div class="field">
      <label>Color Stops</label>
      <div id="grad-stops"></div>
      <button class="btn-sm" id="grad-add-stop" style="margin-top:6px;">+ Add Stop</button>
    </div>
    <div class="field">
      <label>Preview</label>
      <div id="grad-preview" style="height:40px;border-radius:var(--radius);border:1px solid var(--border);"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">
      <button class="btn-accent btn-sm" id="grad-update" title="Overwrite the selected gradient in the library">Update current</button>
      <button class="btn-sm btn-accent" id="grad-save-new" title="Save as a new named gradient">Save as new…</button>
      <button class="btn-sm" id="grad-cancel" style="margin-left:auto;">Cancel</button>
    </div>
    <div class="cs-sub" id="grad-hint" style="margin-top:6px;"></div>
  </div>
</div>

<script type="module">
import { GET, POST, PATCH, DEL, uuid, showToast, markActiveNav } from '/static/js/app.js';
import { initNav } from '/static/js/nav.js';
import { connectWS } from '/static/js/app.js';

initNav();
connectWS();

let cards = [];
let selectedId = null;
let effectParamsConfig = { categories: {} };
let savedGradients = [];

try { cards = await GET('/color-sets'); } catch (e) { console.error('[ColorSets] load failed', e); }
try { effectParamsConfig = await GET('/effect-params/config'); } catch {}
try { savedGradients = await GET('/gradients'); } catch {}

const $ = (sel) => document.querySelector(sel);
const current = () => cards.find(c => c.id === selectedId);

// ── Scope helpers ───────────────────────────────────────────────────────────
function allVirtuals() {
  const cats = Object.keys(effectParamsConfig.categories || {});
  return cats.flatMap(c => (effectParamsConfig.categories[c].virtuals || []).map(v => ({ v, c })));
}
function scopeMode(scope) {
  if (scope?.virtual_ids?.length) return 'virtual';
  if (scope?.categories?.length) return 'category';
  return 'all';
}

// ── List ────────────────────────────────────────────────────────────────────
function renderList() {
  const q = ($('#cs-search').value || '').toLowerCase();
  const rows = cards
    .filter(c => c.name.toLowerCase().includes(q) || (c.labels || []).some(l => l.toLowerCase().includes(q)))
    .map(c => `
      <div class="cs-row${c.id === selectedId ? ' selected' : ''}" data-id="${c.id}">
        <div class="swatch" style="background:${c.color || '#888'}"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;">${c.name}</div>
          <div class="cs-sub">${(c.labels || []).join(', ')}</div>
        </div>
        <span class="badge ${c.kind === 'group' ? 'badge-group' : 'badge-set'}">${c.kind}</span>
      </div>`).join('');
  $('#cs-list').innerHTML = rows || '<div class="cs-sub" style="padding:10px;">No color sets yet.</div>';
  document.querySelectorAll('.cs-row').forEach(r => r.addEventListener('click', () => selectCard(r.dataset.id)));
}

function selectCard(id) {
  syncIfDirty();
  selectedId = id;
  renderList();
  renderEditor();
}

// ── Editor ──────────────────────────────────────────────────────────────────
function renderEditor() {
  const c = current();
  const editor = $('#editor');
  if (!c) { editor.classList.remove('open'); return; }
  editor.classList.add('open');
  $('#editor-title').textContent = c.kind === 'group' ? 'Edit Group' : 'Edit Color Set';
  $('#c-name').value = c.name || '';
  $('#c-color').value = c.color || '#FFD700';
  $('#c-labels').value = (c.labels || []).join(', ');

  $('#set-section').style.display = c.kind === 'set' ? '' : 'none';
  $('#group-section').style.display = c.kind === 'group' ? '' : 'none';

  if (c.kind === 'set') {
    renderEntries(c);
  } else {
    $('#g-mode').value = c.mode || 'cycle';
    $('#g-cycle-behavior').value = c.cycle_behavior || 'wrap';
    $('#g-exclude-current').checked = c.exclude_current !== false;
    renderMembers(c);
  }
}

// ── Entries (Color Set) ───────────────────────────────────────────────────────
function gradientOpts(selected) {
  const inLib = (savedGradients || []).some(g => g.value === selected);
  let html = '';
  if (selected && !inLib) html += `<option value="${selected.replace(/"/g, '&quot;')}" selected>(unsaved)</option>`;
  html += (savedGradients || []).map(g => `<option value="${g.value}"${g.value === selected ? ' selected' : ''}>${g.name}</option>`).join('');
  return html;
}

function entryRowHtml(entry, idx) {
  const cats = Object.keys(effectParamsConfig.categories || {});
  const virts = allVirtuals();
  const sm = scopeMode(entry.scope);
  const catSel = entry.scope?.categories?.[0] || cats[0] || '';
  const vidSel = entry.scope?.virtual_ids?.[0] || virts[0]?.v || '';
  const catOpts = cats.map(c => `<option value="${c}"${c === catSel ? ' selected' : ''}>${c}</option>`).join('');
  const vidOpts = virts.map(({ v, c }) => `<option value="${v}"${v === vidSel ? ' selected' : ''}>${v} (${c})</option>`).join('');

  const fgEn = !!entry.color_value;
  const kind = entry.color_kind || 'gradient';
  const isSolid = kind === 'solid';
  const solidVal = isSolid ? entry.color_value : '#ffffff';

  const bgEn = entry.bg_color != null;
  const bgVal = entry.bg_color || '#000000';

  const modeEn = entry.bg_mode != null;
  const modeVal = entry.bg_mode || 'overwrite';

  const briEn = entry.brightness != null;
  const briVal = entry.brightness != null ? entry.brightness : 0.8;
  const bgbEn = entry.background_brightness != null;
  const bgbVal = entry.background_brightness != null ? entry.background_brightness : 0.3;
  const accEn = entry.accent_color != null;
  const accVal = entry.accent_color || '#000000';

  const rampVal = entry.ramp_ms != null ? entry.ramp_ms : '';

  return `<div class="cs-entry" data-idx="${idx}">
    <div class="cs-entry-head">
      <select class="e-scope-mode" onchange="csScopeModeChange(this)">
        <option value="all"${sm === 'all' ? ' selected' : ''}>All Devices</option>
        <option value="category"${sm === 'category' ? ' selected' : ''}>Category</option>
        <option value="virtual"${sm === 'virtual' ? ' selected' : ''}>Specific Device</option>
      </select>
      <select class="e-scope-cat" style="${sm === 'category' ? '' : 'display:none'}">${catOpts}</select>
      <select class="e-scope-vid" style="${sm === 'virtual' ? '' : 'display:none'}">${vidOpts}</select>
      <button class="btn-sm btn-danger" onclick="this.closest('.cs-entry').remove()" style="margin-left:auto;" title="Remove entry">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" class="e-fg-en"${fgEn ? ' checked' : ''} onchange="csFgToggle(this)"> Color</label>
      <select class="e-fg-kind" onchange="csFgKindChange(this)" style="${fgEn ? '' : 'display:none'}">
        <option value="gradient"${!isSolid ? ' selected' : ''}>Gradient</option>
        <option value="solid"${isSolid ? ' selected' : ''}>Solid</option>
      </select>
      <select class="e-fg-gradient" style="width:180px;${fgEn && !isSolid ? '' : 'display:none'}">${gradientOpts(isSolid ? '' : entry.color_value)}</select>
      <button class="btn-sm e-fg-edit" onclick="csEditGradient(this)" title="Edit / save gradient" style="${fgEn && !isSolid ? '' : 'display:none'}">✎</button>
      <input type="color" class="e-fg-solid" value="${solidVal}" style="width:48px;height:30px;padding:1px;${fgEn && isSolid ? '' : 'display:none'}">
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" class="e-bg-en"${bgEn ? ' checked' : ''} onchange="csBgToggle(this)"> BG Color</label>
      <input type="color" class="e-bg-color" value="${bgVal}" style="width:48px;height:30px;padding:1px;${bgEn ? '' : 'display:none'}">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;margin-left:12px;"><input type="checkbox" class="e-mode-en"${modeEn ? ' checked' : ''} onchange="csModeToggle(this)"> BG Mode</label>
      <select class="e-mode-val" style="${modeEn ? '' : 'display:none'}">
        <option value="overwrite"${modeVal === 'overwrite' ? ' selected' : ''}>Overwrite</option>
        <option value="additive"${modeVal === 'additive' ? ' selected' : ''}>Additive</option>
      </select>
      <span class="cs-sub" style="margin-left:auto;">Color ramp (ms)</span>
      <input type="number" class="e-ramp" value="${rampVal}" min="0" step="50" placeholder="step default" style="width:90px;">
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;"><input type="checkbox" class="e-bri-en"${briEn ? ' checked' : ''} onchange="csBriToggle(this)"> Brightness</label>
      <input type="range" class="e-bri" min="0" max="1" step="0.01" value="${briVal}" style="width:96px;accent-color:var(--accent);${briEn ? '' : 'display:none'}" oninput="this.closest('.cs-entry').querySelector('.e-bri-num').value=(+this.value).toFixed(2)">
      <input type="number" class="e-bri-num" min="0" max="1" step="0.01" value="${(+briVal).toFixed(2)}" style="width:72px;${briEn ? '' : 'display:none'}" oninput="this.closest('.cs-entry').querySelector('.e-bri').value=this.value">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;margin-left:12px;"><input type="checkbox" class="e-bgb-en"${bgbEn ? ' checked' : ''} onchange="csBgbToggle(this)"> BG Brightness</label>
      <input type="range" class="e-bgb" min="0" max="1" step="0.01" value="${bgbVal}" style="width:96px;accent-color:var(--accent);${bgbEn ? '' : 'display:none'}" oninput="this.closest('.cs-entry').querySelector('.e-bgb-num').value=(+this.value).toFixed(2)">
      <input type="number" class="e-bgb-num" min="0" max="1" step="0.01" value="${(+bgbVal).toFixed(2)}" style="width:72px;${bgbEn ? '' : 'display:none'}" oninput="this.closest('.cs-entry').querySelector('.e-bgb').value=this.value">
      <label class="cs-sub" style="display:flex;align-items:center;gap:4px;margin-left:12px;"><input type="checkbox" class="e-acc-en"${accEn ? ' checked' : ''} onchange="csAccToggle(this)"> Third Color</label>
      <input type="color" class="e-acc" value="${accVal}" style="width:48px;height:30px;padding:1px;${accEn ? '' : 'display:none'}">
    </div>
  </div>`;
}

function renderEntries(c) {
  const list = $('#entry-list');
  const entries = c.entries || [];
  list.innerHTML = entries.length ? entries.map((e, i) => entryRowHtml(e, i)).join('')
    : '<div class="cs-sub" style="padding:6px;">No entries. Add one with + Entry.</div>';
}

window.csScopeModeChange = function(sel) {
  const row = sel.closest('.cs-entry');
  row.querySelector('.e-scope-cat').style.display = sel.value === 'category' ? '' : 'none';
  row.querySelector('.e-scope-vid').style.display = sel.value === 'virtual' ? '' : 'none';
};
window.csFgToggle = function(cb) {
  const row = cb.closest('.cs-entry');
  const on = cb.checked;
  row.querySelector('.e-fg-kind').style.display = on ? '' : 'none';
  const solid = row.querySelector('.e-fg-kind').value === 'solid';
  row.querySelector('.e-fg-gradient').style.display = on && !solid ? '' : 'none';
  row.querySelector('.e-fg-edit').style.display = on && !solid ? '' : 'none';
  row.querySelector('.e-fg-solid').style.display = on && solid ? '' : 'none';
};
window.csFgKindChange = function(sel) {
  const row = sel.closest('.cs-entry');
  const solid = sel.value === 'solid';
  row.querySelector('.e-fg-gradient').style.display = solid ? 'none' : '';
  row.querySelector('.e-fg-edit').style.display = solid ? 'none' : '';
  row.querySelector('.e-fg-solid').style.display = solid ? '' : 'none';
};
window.csBgToggle = function(cb) {
  cb.closest('.cs-entry').querySelector('.e-bg-color').style.display = cb.checked ? '' : 'none';
};
window.csModeToggle = function(cb) {
  cb.closest('.cs-entry').querySelector('.e-mode-val').style.display = cb.checked ? '' : 'none';
};
window.csBriToggle = function(cb) {
  const row = cb.closest('.cs-entry');
  row.querySelector('.e-bri').style.display = cb.checked ? '' : 'none';
  row.querySelector('.e-bri-num').style.display = cb.checked ? '' : 'none';
};
window.csBgbToggle = function(cb) {
  const row = cb.closest('.cs-entry');
  row.querySelector('.e-bgb').style.display = cb.checked ? '' : 'none';
  row.querySelector('.e-bgb-num').style.display = cb.checked ? '' : 'none';
};
window.csAccToggle = function(cb) {
  cb.closest('.cs-entry').querySelector('.e-acc').style.display = cb.checked ? '' : 'none';
};

function readEntries() {
  return [...document.querySelectorAll('#entry-list .cs-entry')].map(row => {
    const sm = row.querySelector('.e-scope-mode').value;
    const scope = { virtual_ids: [], categories: [], roles: [] };
    if (sm === 'category') scope.categories = [row.querySelector('.e-scope-cat').value];
    else if (sm === 'virtual') scope.virtual_ids = [row.querySelector('.e-scope-vid').value];

    const fgEn = row.querySelector('.e-fg-en').checked;
    let color_kind = null, color_value = null;
    if (fgEn) {
      color_kind = row.querySelector('.e-fg-kind').value;
      color_value = color_kind === 'solid'
        ? row.querySelector('.e-fg-solid').value
        : row.querySelector('.e-fg-gradient').value;
    }
    const bgEn = row.querySelector('.e-bg-en').checked;
    const bg_color = bgEn ? row.querySelector('.e-bg-color').value : null;
    const modeEn = row.querySelector('.e-mode-en').checked;
    const bg_mode = modeEn ? row.querySelector('.e-mode-val').value : null;
    const briEn = row.querySelector('.e-bri-en').checked;
    const brightness = briEn ? parseFloat(row.querySelector('.e-bri-num').value) : null;
    const bgbEn = row.querySelector('.e-bgb-en').checked;
    const background_brightness = bgbEn ? parseFloat(row.querySelector('.e-bgb-num').value) : null;
    const accEn = row.querySelector('.e-acc-en').checked;
    const accent_color = accEn ? row.querySelector('.e-acc').value : null;
    const rampStr = row.querySelector('.e-ramp').value;
    const ramp_ms = rampStr !== '' && rampStr != null ? parseInt(rampStr) : null;
    return { scope, color_kind, color_value, bg_color, bg_mode,
             brightness, background_brightness, accent_color, ramp_ms };
  });
}

// ── Gradient editor (shared modal) ───────────────────────────────────────────
let gradStops = [];
let gradTargetIdx = null;   // entry index that opened the editor
let gradEditId = null;      // id of the saved gradient currently loaded (or null)

function hexToRgbStr(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${r},${g},${b})`;
}
function buildGradientCss() {
  const dir = $('#grad-dir').value;
  const stops = [...document.querySelectorAll('.grad-stop-row')].map(row => ({
    color: row.querySelector('.grad-stop-color').value,
    pos: parseInt(row.querySelector('.grad-stop-pos').value) || 0,
  })).sort((a, b) => a.pos - b.pos);
  if (!stops.length) return '#ffffff';
  if (stops.length === 1) return stops[0].color;
  return `linear-gradient(${dir}deg, ${stops.map(s => `${hexToRgbStr(s.color)} ${s.pos}%`).join(', ')})`;
}
function updateGradPreview() {
  $('#grad-preview').style.background = buildGradientCss();
}
function renderGradStops() {
  $('#grad-stops').innerHTML = gradStops.map((s, i) => `
    <div class="grad-stop-row" style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
      <input type="color" class="grad-stop-color" value="${s.color}" style="width:40px;height:28px;padding:1px;" oninput="updateGradPreview()">
      <input type="number" class="grad-stop-pos" value="${s.pos}" min="0" max="100" style="width:55px;" oninput="updateGradPreview()">
      <span class="cs-sub">%</span>
      <button class="btn-sm btn-danger" onclick="gradRemoveStop(${i})">✕</button>
    </div>`).join('');
  updateGradPreview();
}
window.updateGradPreview = updateGradPreview;
window.gradRemoveStop = function(i) {
  gradStops = [...document.querySelectorAll('.grad-stop-row')].map(row => ({
    color: row.querySelector('.grad-stop-color').value,
    pos: parseInt(row.querySelector('.grad-stop-pos').value) || 0,
  }));
  gradStops.splice(i, 1);
  renderGradStops();
};
function parseCssGradient(css) {
  const matches = [...(css || '').matchAll(/rgb\((\d+),\s*(\d+),\s*(\d+)\)\s+(\d+)%/g)];
  if (matches.length) {
    return matches.map(m => ({
      color: '#' + [m[1], m[2], m[3]].map(n => parseInt(n).toString(16).padStart(2, '0')).join(''),
      pos: parseInt(m[4]),
    }));
  }
  // hex-stop gradients (e.g. "linear-gradient(90deg, #ff0000 0%, ...)")
  const hexMatches = [...(css || '').matchAll(/(#[0-9a-fA-F]{6})\s+([\d.]+)%/g)];
  if (hexMatches.length) return hexMatches.map(m => ({ color: m[1], pos: Math.round(parseFloat(m[2])) }));
  return [{ color: (css || '').startsWith('#') ? css.slice(0, 7) : '#ffffff', pos: 0 }];
}

window.csEditGradient = function(btn) {
  const row = btn.closest('.cs-entry');
  gradTargetIdx = parseInt(row.dataset.idx);
  const sel = row.querySelector('.e-fg-gradient');
  const val = sel.value || '';
  const g = (savedGradients || []).find(x => x.value === val);
  gradEditId = g ? g.id : null;
  $('#grad-name').value = g ? g.name : '';
  const dirMatch = val.match(/linear-gradient\((\d+)deg/);
  $('#grad-dir').value = dirMatch ? dirMatch[1] : '90';
  gradStops = parseCssGradient(val);
  renderGradStops();
  $('#grad-hint').textContent = gradEditId
    ? 'Editing saved gradient. "Update current" overwrites it everywhere it is used.'
    : 'This entry uses an unsaved gradient — use "Save as new" to add it to the library.';
  $('#grad-update').style.opacity = gradEditId ? '1' : '0.5';
  $('#grad-modal').style.display = 'flex';
};

function applyGradientToEntry(css) {
  // Persist in-progress edits, then point the originating entry at `css`.
  syncFromDOM();
  const c = current();
  if (c && c.entries[gradTargetIdx]) {
    c.entries[gradTargetIdx].color_kind = 'gradient';
    c.entries[gradTargetIdx].color_value = css;
  }
  renderEditor();
}

// ── Members (Group) ───────────────────────────────────────────────────────────
function setOptions(selected) {
  const sets = cards.filter(c => c.kind === 'set');
  return sets.map(s => `<option value="${s.id}"${s.id === selected ? ' selected' : ''}>${s.name}</option>`).join('');
}
function memberRowHtml(member, idx) {
  return `<div class="cs-member" data-idx="${idx}" style="display:flex;align-items:center;gap:8px;">
    <select class="m-ref" style="flex:1;">${setOptions(member.color_set_id)}</select>
    <span class="cs-sub">Wt</span>
    <input type="number" class="m-weight" value="${member.weight ?? 1}" min="0" step="0.1" style="width:64px;">
    <button class="btn-sm" onclick="csMoveMember(this,-1)" title="Move up">↑</button>
    <button class="btn-sm" onclick="csMoveMember(this,1)" title="Move down">↓</button>
    <button class="btn-sm btn-danger" onclick="this.closest('.cs-member').remove()" title="Remove">✕</button>
  </div>`;
}
function renderMembers(c) {
  const list = $('#member-list');
  const members = c.members || [];
  list.innerHTML = members.length ? members.map((m, i) => memberRowHtml(m, i)).join('')
    : '<div class="cs-sub" style="padding:6px;">No members. Add one with + Member.</div>';
}
window.csMoveMember = function(btn, dir) {
  const row = btn.closest('.cs-member');
  const list = row.parentElement;
  if (dir < 0 && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  if (dir > 0 && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
};
function readMembers() {
  return [...document.querySelectorAll('#member-list .cs-member')].map(row => ({
    color_set_id: row.querySelector('.m-ref').value,
    weight: parseFloat(row.querySelector('.m-weight').value) || 1,
  }));
}

// ── Sync / persist ────────────────────────────────────────────────────────────
function syncFromDOM() {
  const c = current();
  if (!c) return null;
  c.name = $('#c-name').value || 'Untitled';
  c.color = $('#c-color').value;
  c.labels = ($('#c-labels').value || '').split(',').map(s => s.trim()).filter(Boolean);
  if (c.kind === 'set') {
    c.entries = readEntries();
  } else {
    c.mode = $('#g-mode').value;
    c.cycle_behavior = $('#g-cycle-behavior').value;
    c.exclude_current = $('#g-exclude-current').checked;
    c.members = readMembers();
  }
  return c;
}
function syncIfDirty() {
  if (current() && $('#editor').classList.contains('open')) syncFromDOM();
}

async function save() {
  const c = syncFromDOM();
  if (!c) return;
  try {
    await POST('/color-sets', c);
    showToast('Saved', 'success');
    renderList();
  } catch (e) { showToast('Save failed: ' + e, 'error'); }
}
async function del() {
  const c = current();
  if (!c) return;
  if (!confirm(`Delete "${c.name}"?`)) return;
  try {
    await DEL('/color-sets/' + c.id);
    cards = cards.filter(x => x.id !== c.id);
    selectedId = null;
    renderList();
    $('#editor').classList.remove('open');
  } catch (e) { showToast('Delete failed: ' + e, 'error'); }
}
function duplicate() {
  const c = syncFromDOM();
  if (!c) return;
  const copy = JSON.parse(JSON.stringify(c));
  copy.id = uuid();
  copy.name = c.name + ' (copy)';
  cards.push(copy);
  selectedId = copy.id;
  renderList();
  renderEditor();
}
async function preview() {
  const c = current();
  if (!c) return;
  await save();
  try {
    await POST('/color-sets/' + c.id + '/fire', {});
    showToast('Fired', 'success');
  } catch (e) { showToast('Preview failed: ' + e, 'error'); }
}

function newCard(kind) {
  const c = {
    id: uuid(),
    name: kind === 'group' ? 'New Group' : 'New Color Set',
    color: '#FFD700',
    kind,
    labels: [],
    entries: [],
    members: [],
    mode: 'cycle',
    cycle_behavior: 'wrap',
    exclude_current: true,
  };
  cards.push(c);
  selectedId = c.id;
  renderList();
  renderEditor();
}

// ── Import ────────────────────────────────────────────────────────────────────
function openImport() {
  const virts = allVirtuals();
  if (!virts.length) { showToast('No devices configured', 'error'); return; }
  $('#import-device-list').innerHTML = virts.map(({ v, c }) =>
    `<label style="display:flex;align-items:center;gap:8px;padding:3px 0;">
      <input type="checkbox" class="imp-vid" value="${v}" checked> ${v} <span class="cs-sub">(${c})</span>
    </label>`).join('');
  $('#import-modal').classList.add('open');
}
async function doImport() {
  const ids = [...document.querySelectorAll('.imp-vid:checked')].map(cb => cb.value);
  if (!ids.length) { showToast('Select at least one device', 'error'); return; }
  try {
    const res = await POST('/color-sets/import', { virtual_ids: ids });
    cards.push(res.card);
    selectedId = res.card.id;
    $('#import-modal').classList.remove('open');
    renderList();
    renderEditor();
    showToast('Imported', 'success');
  } catch (e) { showToast('Import failed: ' + e, 'error'); }
}

// ── Wire up ────────────────────────────────────────────────────────────────────
$('#cs-search').addEventListener('input', renderList);
$('#btn-new-set').addEventListener('click', () => { syncIfDirty(); newCard('set'); });
$('#btn-new-group').addEventListener('click', () => { syncIfDirty(); newCard('group'); });
$('#btn-save').addEventListener('click', save);
$('#btn-delete').addEventListener('click', del);
$('#btn-duplicate').addEventListener('click', duplicate);
$('#btn-preview').addEventListener('click', preview);
$('#btn-add-entry').addEventListener('click', () => {
  const div = document.createElement('div');
  const placeholderRemoved = $('#entry-list').querySelector('.cs-entry');
  if (!placeholderRemoved) $('#entry-list').innerHTML = '';
  div.innerHTML = entryRowHtml({ scope: { virtual_ids: [], categories: [], roles: [] } }, $('#entry-list').children.length);
  $('#entry-list').appendChild(div.firstElementChild);
});
$('#btn-add-member').addEventListener('click', () => {
  const sets = cards.filter(c => c.kind === 'set');
  if (!sets.length) { showToast('Create a Color Set first', 'error'); return; }
  const placeholder = $('#member-list').querySelector('.cs-member');
  if (!placeholder) $('#member-list').innerHTML = '';
  const div = document.createElement('div');
  div.innerHTML = memberRowHtml({ color_set_id: sets[0].id, weight: 1 }, $('#member-list').children.length);
  $('#member-list').appendChild(div.firstElementChild);
});
$('#btn-import').addEventListener('click', openImport);
$('#btn-import-cancel').addEventListener('click', () => $('#import-modal').classList.remove('open'));
$('#btn-import-go').addEventListener('click', doImport);

// Gradient editor modal
$('#grad-add-stop').addEventListener('click', () => {
  gradStops = [...document.querySelectorAll('.grad-stop-row')].map(row => ({
    color: row.querySelector('.grad-stop-color').value,
    pos: parseInt(row.querySelector('.grad-stop-pos').value) || 0,
  }));
  gradStops.push({ color: '#ffffff', pos: 50 });
  renderGradStops();
});
$('#grad-dir').addEventListener('change', updateGradPreview);
$('#grad-cancel').addEventListener('click', () => { $('#grad-modal').style.display = 'none'; });
$('#grad-update').addEventListener('click', async () => {
  const value = buildGradientCss();
  const name = $('#grad-name').value.trim();
  if (!gradEditId) { showToast('Not a saved gradient — use "Save as new"', 'error'); return; }
  const finalName = name || (savedGradients.find(g => g.id === gradEditId)?.name) || 'Gradient';
  try {
    const saved = await PATCH('/gradients/' + gradEditId, { name: finalName, value });
    const idx = savedGradients.findIndex(g => g.id === gradEditId);
    if (idx >= 0) savedGradients[idx] = saved;
    $('#grad-modal').style.display = 'none';
    applyGradientToEntry(saved.value);
    showToast('Gradient updated', 'success');
  } catch (e) { showToast('Update failed: ' + e, 'error'); }
});
$('#grad-save-new').addEventListener('click', async () => {
  const name = $('#grad-name').value.trim();
  if (!name) { showToast('Enter a name for the new gradient', 'error'); $('#grad-name').focus(); return; }
  const value = buildGradientCss();
  try {
    const saved = await POST('/gradients', { name, value });
    savedGradients.push(saved);
    $('#grad-modal').style.display = 'none';
    applyGradientToEntry(saved.value);
    showToast('Gradient saved', 'success');
  } catch (e) { showToast('Save failed: ' + e, 'error'); }
});

renderList();
markActiveNav();
</script>
</body>
</html>
