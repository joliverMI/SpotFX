<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotFX — Playlist Absorb</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav>
    <span class="logo">SpotFX</span>
    <a href="/">Now Playing</a>
    <a href="/builder.html">Profile Builder</a>
    <a href="/events.html">Events</a>
    <a href="/playlist.html" class="active">Playlist</a>
    <a href="/settings.html">Settings</a>
    <a href="/ai_triggers.html">AI Triggers</a>
    <a href="/triggerless.html">Triggerless</a>
    <div id="ws-status"><div id="ws-dot"></div> Live</div>
  </nav>

  <main>
    <div class="card">
      <div class="card-title">Playlist Absorb</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px;">
        Paste a Spotify playlist link below. SpotFX will queue each song for playback
        on the configured device and capture its audio shape automatically.
      </p>
      <div class="field">
        <label>Spotify Playlist URL or URI</label>
        <input type="text" id="playlist-url" placeholder="https://open.spotify.com/playlist/…">
      </div>
      <button class="btn-accent" id="btn-start">Start Absorb</button>
    </div>

    <div class="card" id="absorb-status" style="display:none">
      <div class="card-title">Progress</div>
      <div id="absorb-progress" style="font-size:13px;color:var(--text-muted);">Starting…</div>
    </div>
  </main>
</div>

<script type="module">
import { connectWS, markActiveNav } from '/static/js/app.js';
markActiveNav();
connectWS();

document.getElementById('btn-start').addEventListener('click', () => {
  const url = document.getElementById('playlist-url').value.trim();
  if (!url) return;
  document.getElementById('absorb-status').style.display = '';
  document.getElementById('absorb-progress').textContent = 'Playlist absorb will be implemented in a future step.';
});
</script>
</body>
</html>
