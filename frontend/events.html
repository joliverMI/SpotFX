<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotFX — Events</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .event-row { display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius); cursor:pointer; }
    .event-row:hover { background:var(--surface2); }
    .event-row.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:7px; }
    .editor { display:none; }
    .editor.open { display:block; }
    .action-row { margin-bottom:6px; background:var(--surface2); padding:8px; border-radius:var(--radius); }
    .action-row-header { display:flex; align-items:center; gap:8px; }
    .action-type { min-width:0; flex:1; max-width:160px; }
    .action-dynamic { margin-top:6px; }
    .action-dynamic label { font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:3px; }
    .action-hint { font-size:11px; color:var(--text-muted); font-style:italic; padding:4px 0; }
    .amb-fields { display:grid; gap:4px; }
    .amb-field { display:flex; align-items:center; gap:8px; }
    .amb-label { font-size:11px; color:var(--text-muted); width:88px; flex-shrink:0; text-align:right; }
    .amb-range { flex:1; min-width:80px; accent-color:var(--accent); }
    .amb-num { width:52px; }
    .step-row { margin-bottom:6px; background:var(--surface2); padding:8px; border-radius:var(--radius); }
    .step-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .step-body { margin-top:4px; }
    .step-action-row + .step-action-row { border-top:1px solid var(--border); padding-top:6px; margin-top:6px; }
    .ep-param-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="nav-root"></div>

  <main>
    <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;">
      <!-- ── Event list ─────────────────────────────────────────────────── -->
      <div class="card" style="min-width:0;max-height:calc(100vh - 80px);display:flex;flex-direction:column;">
        <div class="card-title" style="display:flex;align-items:center;">
          Events
          <button class="btn-sm btn-accent" id="btn-new" style="margin-left:auto">+ New</button>
        </div>
        <div class="field">
          <input id="event-search" type="text" placeholder="Search / filter by label…">
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          <button class="btn-sm" id="filter-single">Single</button>
          <button class="btn-sm" id="filter-sequence">Sequence</button>
          <button class="btn-sm" id="filter-beat-seq">Beat Seq</button>
          <button class="btn-sm" id="filter-ai-ex" title="Show only events exposed to AI generation">AI Ex</button>
        </div>
        <div id="event-list" style="overflow-y:auto;flex:1;min-height:0;"></div>
      </div>

      <!-- ── Editor ────────────────────────────────────────────────────── -->
      <div class="card editor" id="editor" style="max-height:calc(100vh - 80px);overflow-y:auto;">
        <div class="card-title">Edit Event</div>
        <div class="event-action-bar" style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <button class="btn-accent action-save">Save</button>
          <button class="btn-danger btn-sm action-delete">Delete</button>
          <button class="btn-sm action-duplicate">Duplicate</button>
          <button class="btn-sm action-fire" style="margin-left:auto">▶ Fire</button>
        </div>
        <div class="field">
          <label>Name</label>
          <input id="e-name" type="text" placeholder="Event name">
        </div>
        <div class="field" style="display:flex;gap:12px;align-items:flex-end;">
          <div>
            <label>Marker Color</label>
            <input type="color" id="e-color" value="#FFD700" style="width:48px;height:34px;padding:2px;">
          </div>
          <div style="flex:1">
            <label>Labels (comma separated)</label>
            <input id="e-labels" type="text" placeholder="e.g. drop, blue">
          </div>
          <button id="e-ai-exposed-btn" type="button" title="Expose to AI generation"
            onclick="toggleAiExposed()"
            style="flex-shrink:0;height:34px;padding:0 10px;font-size:11px;border-radius:4px;
                   border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
                   cursor:pointer;white-space:nowrap;">AI Ex</button>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:12px;">
          <label style="white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:6px;">
            <input type="checkbox" id="e-energy-en"> Energy level
          </label>
          <input type="range" id="e-energy-val" min="1" max="10" step="1" value="5" style="flex:1" disabled>
          <span id="e-energy-display" style="width:20px;text-align:center;font-size:13px;font-weight:600;">5</span>
        </div>
        <!-- Pre-command options — only shown for single events -->
        <div id="single-pre-commands" style="display:none">
          <div class="field" style="display:flex;align-items:center;gap:12px;">
            <label style="white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="e-pre-brightness-en"> Pre-brightness
            </label>
            <input type="range" id="e-pre-brightness-val" min="0" max="1" step="0.01" value="1" style="flex:1" disabled>
            <span id="e-pre-brightness-display" style="width:36px;text-align:right;font-size:13px;font-weight:600;">100%</span>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:12px;">
            <label style="white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:6px;">
              <input type="checkbox" id="e-pre-transition-en"> Pre-transition
            </label>
            <input type="range" id="e-pre-transition-val" min="0" max="5" step="0.1" value="0.5" style="flex:1" disabled>
            <span id="e-pre-transition-display" style="width:36px;text-align:right;font-size:13px;font-weight:600;">0.5s</span>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:12px;">
            <label style="white-space:nowrap;font-size:12px;">Pre-brightness ramp (ms)</label>
            <input type="number" id="e-pre-brightness-ramp" min="0" step="50" placeholder="global default" style="width:110px">
            <span style="font-size:11px;color:var(--text-muted);">blank = use global smooth_ramp_ms</span>
          </div>
        </div>
        <div class="field">
          <label>Type</label>
          <select id="e-type">
            <option value="single">Single (random from list)</option>
            <option value="sequence">Sequence</option>
            <option value="beat_sequence">Beat Sequence</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
          <label style="white-space:nowrap;font-size:12px;">Event offset (ms)</label>
          <input type="number" id="e-offset" step="50" value="0" style="width:100px">
          <span style="font-size:11px;color:var(--text-muted);">negative = fire earlier</span>
        </div>

        <!-- Single actions list -->
        <div id="actions-section">
          <div class="card-title" style="margin-top:8px;">Actions <button class="btn-sm" id="btn-add-action">+ Action</button></div>
          <div id="action-list"></div>
        </div>

        <!-- Sequence steps list -->
        <div id="sequence-section" style="display:none">
          <div class="card-title" style="margin-top:8px;">Sequence Steps <span id="seq-dur" style="font-size:11px;font-weight:400;opacity:0.55;"></span> <button class="btn-sm" id="btn-add-step">+ Step</button></div>
          <div id="step-list"></div>

          <!-- Revert -->
          <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;">
              <input type="checkbox" id="revert-en">
              <span style="font-weight:500;">Revert after sequence</span>
            </label>
            <div id="revert-opts" style="display:none;margin-top:8px;">
              <div style="display:grid;grid-template-columns:max-content 72px auto;gap:5px 8px;align-items:center;font-size:12px;">
                <span>Delay</span>
                <input type="number" id="revert-delay" min="0" step="50" value="0"
                  style="width:72px;text-align:right;font-size:12px;padding:2px 4px;">
                <span>ms after last step</span>
                <span>Transition</span>
                <input type="number" id="revert-transition" min="0" step="50" value="500"
                  style="width:72px;text-align:right;font-size:12px;padding:2px 4px;">
                <span>ms <span style="opacity:0.55;">(brightness)</span></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Beat Sequence steps list -->
        <div id="beat-sequence-section" style="display:none">
          <div class="card-title" style="margin-top:8px;display:flex;align-items:center;gap:8px;">
            Beat Steps
            <span id="bs-beat-count" style="font-size:11px;font-weight:400;opacity:0.55;"></span>
            <span style="margin-left:auto;font-size:11px;color:var(--text-muted);">Offset:</span>
            <input type="number" id="bs-start-offset" value="0" step="50"
              style="width:58px;text-align:right;font-size:12px;padding:2px 4px;"
              title="Shift entire sequence by this many ms (negative = start earlier)">
            <span style="font-size:11px;color:var(--text-muted);">ms</span>
            <span style="font-size:11px;color:var(--text-muted);">Fallback:</span>
            <select id="bs-fallback" style="font-size:12px;padding:2px 4px;">
              <option value="fallback">120 BPM</option>
              <option value="skip">Skip</option>
            </select>
            <button class="btn-sm" id="btn-add-bs-step">+ Step</button>
          </div>
          <div id="bs-step-list"></div>

          <!-- Beat Revert -->
          <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;">
              <input type="checkbox" id="bs-revert-en">
              <span style="font-weight:500;">Revert after beat sequence</span>
            </label>
            <div id="bs-revert-opts" style="display:none;margin-top:8px;">
              <div style="display:grid;grid-template-columns:max-content 72px auto;gap:5px 8px;align-items:center;font-size:12px;">
                <span>Delay</span>
                <input type="number" id="bs-revert-delay" min="0" step="1" value="0"
                  style="width:72px;text-align:right;font-size:12px;padding:2px 4px;">
                <span>beats after last step</span>
                <span>Transition</span>
                <input type="number" id="bs-revert-transition" min="0" step="50" value="500"
                  style="width:72px;text-align:right;font-size:12px;padding:2px 4px;">
                <span>ms ramp</span>
                <span>Pre-ramp</span>
                <input type="checkbox" id="bs-revert-pre-ramp" checked style="justify-self:start;">
                <span style="opacity:0.55;">start ramp before beat so it completes on beat</span>
              </div>
            </div>
          </div>
        </div>

        <div class="event-action-bar" style="display:flex;gap:8px;margin-top:16px;align-items:center;">
          <button id="btn-save" class="btn-accent action-save">Save</button>
          <button id="btn-delete" class="btn-danger btn-sm action-delete">Delete</button>
          <button id="btn-duplicate" class="btn-sm action-duplicate">Duplicate</button>
          <button id="btn-fire" class="btn-sm action-fire" style="margin-left:auto">▶ Fire</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { connectWS, GET, POST, DEL, uuid } from '/static/js/app.js';
import { initNav } from '/static/js/nav.js';
initNav();
connectWS();

let events = [];
let scenes = [];
let selectedId = null;
let typeFilter    = null;
let aiExFilter    = false;
const _RAMP_TYPES = new Set(['ledfx_global_brightness', 'ledfx_effect_param']);
let allParamLabels = [];
let effectParamsConfig = {};
let savedGradients = [];

// Init
let appSettings = {};
try { events = await GET('/events'); } catch (e) { console.error('[Events] failed to load:', e); }
try { scenes = await GET('/control/ledfx/scenes'); } catch {}
try { allParamLabels = await GET('/effect-params/labels'); } catch {}
try { effectParamsConfig = await GET('/effect-params/config'); } catch {}
try { savedGradients = await GET('/gradients'); } catch {}
try { appSettings = await GET('/settings'); } catch {}
renderList();

// ── Searchable select helper ───────────────────────────────────────────────
// Returns HTML: a filter text input + a <select> below it.
// opts: [{value, label}], selectedValue: the currently selected value, selectCls: CSS class for the <select>
function searchableSelect(selectCls, opts, selectedValue) {
  const optsJson = JSON.stringify(opts).replace(/'/g, '&#39;');
  const optHtml = opts.map(o =>
    `<option value="${o.value}"${o.value === selectedValue ? ' selected' : ''}>${o.label}</option>`
  ).join('');
  return `<div style="display:flex;flex-direction:column;gap:3px;">
    <input type="text" class="ss-filter" placeholder="Filter…"
      data-options='${optsJson}' oninput="filterSearchSelect(this)"
      style="font-size:12px;padding:3px 6px;">
    <select class="${selectCls}" style="width:100%">${optHtml}</select>
  </div>`;
}

// Rebuilds the adjacent <select> options based on the filter input text
window.filterSearchSelect = function(input) {
  const q = input.value.toLowerCase();
  const select = input.nextElementSibling;
  const currentVal = select.value;
  const all = JSON.parse(input.dataset.options);
  const filtered = q ? all.filter(o => o.label.toLowerCase().includes(q)) : all;
  select.innerHTML = filtered.map(o =>
    `<option value="${o.value}"${o.value === currentVal ? ' selected' : ''}>${o.label}</option>`
  ).join('');
  if (!select.value && filtered.length) select.value = filtered[0].value;
};

function eventOpts(excludeId) {
  return events.filter(ev => ev.id !== excludeId).map(ev => ({
    value: ev.id,
    label: ev.name + (ev.labels?.length ? ' [' + ev.labels.join(', ') + ']' : ''),
  }));
}

function sceneOpts() {
  return scenes.map(s => ({ value: s.id, label: s.name || s.id }));
}

// ── Action type helpers ────────────────────────────────────────────────────
const ACTION_TYPES = [
  { value: 'event_ref',               label: 'Event'             },
  { value: 'ledfx_scene',             label: 'Scene'             },
  { value: 'ledfx_ambient',           label: 'Change Ambient'    },
  { value: 'ledfx_ambient_color',     label: 'Contrast Color'    },
  { value: 'ledfx_global_brightness', label: 'Global Brightness' },
  { value: 'ledfx_global_transition', label: 'Global Transition' },
  { value: 'ledfx_effect_param',      label: 'Effect Parameter'  },
];

function typeOptions(selected) {
  return ACTION_TYPES.map(t =>
    `<option value="${t.value}"${t.value === selected ? ' selected' : ''}>${t.label}</option>`
  ).join('');
}

// Slider + number input pair for ambient fields
function ambSlider(label, cls, min, max, step, val) {
  const rv = val != null ? val : (min + max) / 2;
  return `<div class="amb-field">
    <span class="amb-label">${label}</span>
    <input type="range" class="amb-range" data-target="${cls}" min="${min}" max="${max}" step="${step}" value="${rv}">
    <input type="number" class="${cls} amb-num" min="${min}" max="${max}" step="${step}" value="${val ?? ''}" placeholder="—">
  </div>`;
}

// Dynamic fields section per action type
function actionFields(a) {
  switch (a.type) {
    case 'event_ref':
      return searchableSelect('action-event', eventOpts(selectedId), a.event_id || '');

    case 'ledfx_scene':
      return searchableSelect('action-scene', sceneOpts(), a.scene_id || '');

    case 'ledfx_ambient':
      return `<div class="amb-fields">
        <div class="amb-field">
          <span class="amb-label">Color</span>
          <input type="checkbox" class="action-amb-color-en"${a.color ? ' checked' : ''}>
          <input type="color" class="action-amb-color" value="${a.color || '#0000ff'}" style="width:36px;height:22px;padding:1px;flex:1">
        </div>
        ${ambSlider('Blur', 'action-amb-blur', 0, 10, 0.1, a.blur)}
        ${ambSlider('Bass decay', 'action-amb-bdr', 0, 1, 0.01, a.bass_decay_rate)}
        ${ambSlider('BG brightness', 'action-amb-bgb', 0, 1, 0.01, a.background_brightness)}
        ${ambSlider('Brightness', 'action-amb-brt', 0, 1, 0.01, a.brightness)}
        ${ambSlider('Max brightness', 'action-amb-maxbrt', 0, 1, 0.01, a.max_brightness)}
      </div>`;

    case 'ledfx_ambient_color':
      return `<span class="action-hint">Reads current ambient color → applies 180° complementary color (cache-based, no latency)</span>`;


    case 'ledfx_global_brightness':
      return `<label>Brightness
        <input type="range" class="action-gb-val" min=0 max=1 step=0.01 value="${a.brightness ?? 1}" style="width:100px">
        <span class="action-gb-display">${(a.brightness ?? 1).toFixed(2)}</span></label>
        <label style="margin-left:8px;">Ramp (ms) <input type="number" class="action-gb-ramp" value="${a.ramp_ms ?? ''}" min="0" step="50" placeholder="global" style="width:80px"></label>`;

    case 'ledfx_global_transition':
      return `<label>Time (s) <input type="number" class="action-gt-time" value="${a.transition_time ?? 0.5}" min=0 step=0.1 style="width:60px"></label>
        <label>Mode <select class="action-gt-mode">
          <option value=""${!a.transition_mode ? ' selected' : ''}>(unchanged)</option>
          ${['Add','Dissolve','Fade','Wipe','Slide'].map(m =>
            `<option value="${m}"${a.transition_mode === m ? ' selected' : ''}>${m}</option>`).join('')}
        </select></label>`;

    case 'ledfx_effect_param': {
      const cats = Object.keys(effectParamsConfig.categories || {});
      const allVirts = cats.flatMap(c =>
        (effectParamsConfig.categories[c].virtuals || []).map(v => ({ v, c }))
      );
      const scopeMode = a.virtual_id ? 'device' : (a.category ? 'category' : 'all');
      const catOptsHtml = cats.map(c =>
        `<option value="${c}"${c === a.category ? ' selected' : ''}>${c}</option>`
      ).join('');
      const vidOptsHtml = allVirts.map(({ v, c }) =>
        `<option value="${v}"${v === a.virtual_id ? ' selected' : ''}>${v} (${c})</option>`
      ).join('');
      const paramsHtml = (a.params?.length ? a.params : [{ param_label: allParamLabels[0]?.label || '', target_value: 1 }])
        .map(p => epParamRowHtml(p)).join('');
      const rampVal = a.ramp_ms != null ? a.ramp_ms : '';
      return `<div class="ep-root">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
          <span style="font-size:11px;color:var(--text-muted);">Scope:</span>
          <select class="ep-scope-sel" onchange="epScopeChange(this)">
            <option value="all"${scopeMode === 'all' ? ' selected' : ''}>All Devices</option>
            <option value="category"${scopeMode === 'category' ? ' selected' : ''}>Category</option>
            <option value="device"${scopeMode === 'device' ? ' selected' : ''}>Specific Device</option>
          </select>
          <select class="ep-scope-cat" style="${scopeMode === 'category' ? '' : 'display:none'}">${catOptsHtml}</select>
          <select class="ep-scope-vid" style="${scopeMode === 'device' ? '' : 'display:none'}">${vidOptsHtml}</select>
        </div>
        <div class="ep-params-list">${paramsHtml}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
          <button class="btn-sm" onclick="epAddParam(this.closest('.ep-root').querySelector('.ep-params-list'))">+ Add Param</button>
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto">Ramp (ms)</span>
          <input type="number" class="ep-ramp" value="${rampVal}" min="0" step="50" placeholder="global" style="width:80px">
        </div>
      </div>`;
    }

    default:
      return '';
  }
}

// Effect-param action helpers
function epToggleInputHtml(p) {
  const ta = p?.toggle_action || 'toggle';
  return `<select class="ep-param-toggle-action" style="width:80px">
    <option value="toggle"${ta === 'toggle' ? ' selected' : ''}>Toggle</option>
    <option value="on"${ta === 'on' ? ' selected' : ''}>On</option>
    <option value="off"${ta === 'off' ? ' selected' : ''}>Off</option>
  </select>`;
}

function epNumInputHtml(p, meta) {
  const flipActive = p?.flip_sign === true;
  const flipBtn = meta?.flip_sign
    ? `<button type="button" class="ep-param-flip btn-sm${flipActive ? ' active' : ''}"
        onclick="this.classList.toggle('active');const a=this.classList.contains('active');this.style.background=a?'rgba(255,152,0,0.2)':'';this.style.color=a?'#ffb74d':'';this.style.borderColor=a?'#ffb74d':'';"
        title="Flip: apply opposite sign of current value"
        style="padding:2px 6px;margin-left:2px;${flipActive ? 'background:rgba(255,152,0,0.2);color:#ffb74d;border-color:#ffb74d;' : ''}"
        >Flip</button>`
    : '';
  return `<input type="number" class="ep-param-val" value="${p?.target_value ?? ''}" step="0.01" style="width:60px" placeholder="val">${flipBtn}`;
}

function epPolarInputHtml(p) {
  return `<input type="number" class="ep-param-angle" value="${p?.polar_angle ?? 0}"
      step="5" style="width:64px" placeholder="angle">
    <span style="font-size:10px;color:var(--text-muted)">°</span>
    <input type="number" class="ep-param-radius" value="${p?.polar_radius ?? 0.5}"
      step="0.05" min="0" max="1" style="width:64px" placeholder="r">`;
}

function epMoveXYInputHtml(p) {
  return `<input type="number" class="ep-move-x" value="${p?.move_x ?? 0}"
      step="0.05" style="width:60px" placeholder="Δx">
    <input type="number" class="ep-move-y" value="${p?.move_y ?? 0}"
      step="0.05" style="width:60px" placeholder="Δy">`;
}

function epMovePolarInputHtml(p) {
  return `<input type="number" class="ep-move-angle" value="${p?.move_angle ?? 0}"
      step="5" style="width:64px" placeholder="Δ°">
    <span style="font-size:10px;color:var(--text-muted)">°</span>
    <input type="number" class="ep-move-radius" value="${p?.move_radius ?? 0}"
      step="0.05" style="width:60px" placeholder="Δr">`;
}

function epColorInputHtml(p) {
  const val = p?.string_value || '#ffffff';
  return `<input type="color" class="ep-param-color" value="${val}" style="width:48px;height:28px;padding:1px;">`;
}

function epGradientInputHtml(p) {
  const currentVal = p?.string_value || '';
  const isSolid = /^#[0-9a-fA-F]{6}$/.test(currentVal);
  const solidColor = isSolid ? currentVal : '#ffffff';
  const gradVal = isSolid ? '' : currentVal;
  const opts = savedGradients.map(g =>
    `<option value="${g.value}"${g.value === gradVal ? ' selected' : ''}>${g.name}</option>`
  ).join('');
  const preview = currentVal ? `background:${currentVal}` : '';
  const solidDisplay = isSolid ? '' : 'display:none';
  const gradDisplay  = isSolid ? 'display:none' : '';
  return `<select class="ep-param-gradient-mode" style="width:80px" onchange="epGradModeChange(this)">
      <option value="gradient"${!isSolid ? ' selected' : ''}>Gradient</option>
      <option value="solid"${isSolid ? ' selected' : ''}>Solid Color</option>
    </select>
    <select class="ep-param-gradient" style="width:120px;${gradDisplay}" onchange="epGradPreview(this)">${opts || '<option value="">No gradients saved</option>'}</select>
    <input type="color" class="ep-param-solid-color" value="${solidColor}" style="width:36px;height:28px;padding:1px;${solidDisplay}" onchange="epGradPreview(this)">
    <div class="ep-grad-preview" style="width:36px;height:28px;border-radius:3px;border:1px solid var(--border);${preview}"></div>`;
}

function epParamRowHtml(p) {
  const selectedLabel = allParamLabels.find(o => o.label === p?.param_label) || allParamLabels[0];
  const ptype = selectedLabel?.type || 'numeric';
  const labelSel = allParamLabels.map(o =>
    `<option value="${o.label}" data-type="${o.type}"${o.label === (p?.param_label ?? selectedLabel?.label) ? ' selected' : ''}>${o.label}</option>`
  ).join('');
  let valueInput;
  if (ptype === 'toggle') valueInput = epToggleInputHtml(p);
  else if (ptype === 'color') valueInput = epColorInputHtml(p);
  else if (ptype === 'gradient') valueInput = epGradientInputHtml(p);
  else if (ptype === 'polar') valueInput = epPolarInputHtml(p);
  else if (ptype === 'move_xy') valueInput = epMoveXYInputHtml(p);
  else if (ptype === 'move_polar') valueInput = epMovePolarInputHtml(p);
  else valueInput = epNumInputHtml(p, selectedLabel);
  return `<div class="ep-param-row">
    <select class="ep-param-label" style="flex:1" onchange="epLabelChange(this)">${labelSel}</select>
    ${valueInput}
    <button class="btn-sm btn-danger" onclick="this.closest('.ep-param-row').remove()">✕</button>
  </div>`;
}

window.epGradPreview = function(sel) {
  const row = sel.closest('.ep-param-row');
  const preview = row?.querySelector('.ep-grad-preview');
  if (!preview) return;
  // Determine active value: solid color input or gradient select
  const solidInput = row.querySelector('.ep-param-solid-color');
  const gradSel    = row.querySelector('.ep-param-gradient');
  const modeEl     = row.querySelector('.ep-param-gradient-mode');
  const isSolid    = modeEl?.value === 'solid';
  const val = isSolid ? (solidInput?.value || '#ffffff') : (gradSel?.value || '');
  preview.style.background = val;
};

window.epGradModeChange = function(sel) {
  const row = sel.closest('.ep-param-row');
  const isSolid = sel.value === 'solid';
  const gradSel   = row.querySelector('.ep-param-gradient');
  const solidInput = row.querySelector('.ep-param-solid-color');
  if (gradSel)    gradSel.style.display    = isSolid ? 'none' : '';
  if (solidInput) solidInput.style.display = isSolid ? '' : 'none';
  epGradPreview(sel);
};

// Swap value input when label type changes
window.epLabelChange = function(sel) {
  const row = sel.closest('.ep-param-row');
  const labelMeta = allParamLabels.find(o => o.label === sel.value);
  const ptype = labelMeta?.type || 'numeric';
  const btn = row.querySelector('.btn-danger');
  // Remove all existing value inputs
  row.querySelectorAll(
    '.ep-param-val,.ep-param-toggle-action,.ep-param-color,.ep-param-gradient,' +
    '.ep-param-gradient-mode,.ep-param-solid-color,.ep-grad-preview,' +
    '.ep-param-flip,.ep-param-angle,.ep-param-radius,' +
    '.ep-move-x,.ep-move-y,.ep-move-angle,.ep-move-radius'
  ).forEach(el => el.remove());
  // Also remove degree-sign spans (between angle and radius inputs)
  row.querySelectorAll('span').forEach(el => { if (el.textContent.trim() === '°') el.remove(); });
  const tmp = document.createElement('div');
  if (ptype === 'toggle') tmp.innerHTML = epToggleInputHtml(null);
  else if (ptype === 'color') tmp.innerHTML = epColorInputHtml(null);
  else if (ptype === 'gradient') tmp.innerHTML = epGradientInputHtml(null);
  else if (ptype === 'polar') tmp.innerHTML = epPolarInputHtml(null);
  else if (ptype === 'move_xy') tmp.innerHTML = epMoveXYInputHtml(null);
  else if (ptype === 'move_polar') tmp.innerHTML = epMovePolarInputHtml(null);
  else tmp.innerHTML = epNumInputHtml(null, labelMeta);
  while (tmp.firstChild) row.insertBefore(tmp.firstChild, btn);
};

window.epScopeChange = function(sel) {
  const root = sel.closest('.ep-root');
  root.querySelector('.ep-scope-cat').style.display = sel.value === 'category' ? '' : 'none';
  root.querySelector('.ep-scope-vid').style.display = sel.value === 'device' ? '' : 'none';
};

window.epAddParam = function(list) {
  const div = document.createElement('div');
  div.innerHTML = epParamRowHtml({ param_label: allParamLabels[0]?.label || '', target_value: 1 });
  list.appendChild(div.firstElementChild);
};

// Sync slider ↔ number inputs in a container
function wireSliders(container) {
  container.querySelectorAll('.amb-range').forEach(range => {
    const num = container.querySelector('.' + range.dataset.target);
    if (!num) return;
    const decimals = parseFloat(range.step) < 0.1 ? 2 : 1;
    range.addEventListener('input', () => { num.value = parseFloat(range.value).toFixed(decimals); });
    num.addEventListener('input', () => { if (num.value !== '') range.value = num.value; });
    if (num.value !== '') range.value = num.value;
  });
  // Global brightness range display
  const gbRange = container.querySelector('.action-gb-val');
  if (gbRange) gbRange.addEventListener('input', () => {
    container.querySelector('.action-gb-display').textContent = parseFloat(gbRange.value).toFixed(2);
  });
}

// Change action type: rebuild dynamic section only, preserve weight/labels
window.changeActionType = function(sel) {
  const row = sel.closest('[data-type]');
  row.dataset.type = sel.value;
  row.querySelector('.action-dynamic').innerHTML = actionFields({ type: sel.value });
  wireSliders(row);
};

// Change step type: swap event picker ↔ action editor
window.changeStepType = function(sel) {
  const row = sel.closest('.step-row');
  const body = row.querySelector('.step-body');
  if (sel.value === 'action') {
    body.innerHTML = renderStepActionBody(null);
    wireSliders(row);
    wireStepActionButtons(row, () => {
      const e = events.find(e => e.id === selectedId);
      if (e) { e.sequence_steps = syncStepsFromDOM(); renderSequence(e); }
    });
  } else {
    body.innerHTML = renderStepEventBody(null);
  }
};

// Read a single action row back to an action object
function syncActionFromRow(row) {
  const type   = row.querySelector('.action-type')?.value || 'ledfx_scene';
  const weight = parseFloat(row.querySelector('.action-weight')?.value) || 1;
  const labels = (row.querySelector('.action-labels')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  const num = (cls) => { const v = row.querySelector(cls)?.value; return (v !== '' && v != null) ? parseFloat(v) : null; };

  switch (type) {
    case 'event_ref':
      return { type, event_id: row.querySelector('.action-event')?.value || '', weight, labels };

    case 'ledfx_scene':
      return { type, scene_id: row.querySelector('.action-scene')?.value || '', weight, labels };

    case 'ledfx_ambient': {
      const colorEn = row.querySelector('.action-amb-color-en')?.checked;
      return {
        type, weight, labels,
        color:                colorEn ? (row.querySelector('.action-amb-color')?.value || null) : null,
        blur:                 num('.action-amb-blur'),
        bass_decay_rate:      num('.action-amb-bdr'),
        background_brightness:num('.action-amb-bgb'),
        brightness:           num('.action-amb-brt'),
        max_brightness:       num('.action-amb-maxbrt'),
      };
    }

    case 'ledfx_ambient_color':
      return { type, weight, labels };


    case 'ledfx_global_brightness': {
      const rampStr = row.querySelector('.action-gb-ramp')?.value;
      return {
        type, weight, labels,
        brightness: parseFloat(row.querySelector('.action-gb-val')?.value ?? 1),
        ramp_ms: rampStr !== '' && rampStr != null ? parseInt(rampStr) : null,
      };
    }

    case 'ledfx_global_transition': {
      const mode = row.querySelector('.action-gt-mode')?.value;
      return {
        type, weight, labels,
        transition_time: parseFloat(row.querySelector('.action-gt-time')?.value) || 0.5,
        transition_mode: mode || null,
      };
    }

    case 'ledfx_effect_param': {
      const dyn = row.querySelector('.action-dynamic');
      const scopeMode = dyn.querySelector('.ep-scope-sel')?.value || 'all';
      const virtualId = scopeMode === 'device' ? (dyn.querySelector('.ep-scope-vid')?.value || null) : null;
      const category = scopeMode === 'category' ? (dyn.querySelector('.ep-scope-cat')?.value || null) : null;
      const rampStr = dyn.querySelector('.ep-ramp')?.value;
      const params = [...dyn.querySelectorAll('.ep-param-row')].map(pr => {
        const label = pr.querySelector('.ep-param-label')?.value || '';
        const toggleEl   = pr.querySelector('.ep-param-toggle-action');
        const colorEl    = pr.querySelector('.ep-param-color');
        const gradModeEl = pr.querySelector('.ep-param-gradient-mode');
        const gradEl     = pr.querySelector('.ep-param-gradient');
        const solidEl    = pr.querySelector('.ep-param-solid-color');
        const moveXEl     = pr.querySelector('.ep-move-x');
        const moveYEl     = pr.querySelector('.ep-move-y');
        const moveAngleEl = pr.querySelector('.ep-move-angle');
        const moveRadEl   = pr.querySelector('.ep-move-radius');
        if (moveXEl && moveYEl) return {
          param_label: label, target_value: 0,
          move_x: parseFloat(moveXEl.value) || 0,
          move_y: parseFloat(moveYEl.value) || 0,
        };
        if (moveAngleEl && moveRadEl) return {
          param_label: label, target_value: 0,
          move_angle: parseFloat(moveAngleEl.value) || 0,
          move_radius: parseFloat(moveRadEl.value) || 0,
        };
        const angleEl  = pr.querySelector('.ep-param-angle');
        const radiusEl = pr.querySelector('.ep-param-radius');
        if (angleEl && radiusEl) return {
          param_label: label, target_value: 0,
          polar_angle: parseFloat(angleEl.value) || 0,
          polar_radius: parseFloat(radiusEl.value) || 0.5,
        };
        if (toggleEl) return { param_label: label, target_value: 0, toggle_action: toggleEl.value };
        if (colorEl)  return { param_label: label, target_value: 0, string_value: colorEl.value };
        if (gradModeEl) {
          const isSolid = gradModeEl.value === 'solid';
          const val = isSolid ? (solidEl?.value || '#ffffff') : (gradEl?.value || '');
          return { param_label: label, target_value: 0, string_value: val };
        }
        if (gradEl)   return { param_label: label, target_value: 0, string_value: gradEl.value };
        return {
          param_label: label,
          target_value: parseFloat(pr.querySelector('.ep-param-val')?.value) || 0,
          flip_sign: pr.querySelector('.ep-param-flip')?.classList.contains('active') ?? false,
        };
      }).filter(p => p.param_label);
      return {
        type, weight, labels,
        virtual_id: virtualId,
        category,
        params,
        ramp_ms: rampStr !== '' && rampStr != null ? parseInt(rampStr) : null,
      };
    }

    default:
      return { type: 'ledfx_scene', scene_id: '', weight, labels };
  }
}

// Read all action rows back into e.actions (preserves unsaved edits)
function syncActionsFromDOM(e) {
  const rows = [...document.querySelectorAll('#action-list .action-row')];
  if (!rows.length) return;
  e.actions = rows.map(syncActionFromRow);
}

function renderActionRow(a, i) {
  return `
    <div class="action-row" data-idx="${i}" data-type="${a.type}">
      <div class="action-row-header">
        <select class="action-type" onchange="changeActionType(this)">${typeOptions(a.type)}</select>
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;margin-left:auto">
          Wt <input type="number" class="action-weight" value="${a.weight ?? 1}" style="width:64px">
        </span>
        <input type="text" class="action-labels" value="${(a.labels||[]).join(', ')}" placeholder="labels" style="width:80px">
        <button class="btn-sm action-dup" data-idx="${i}" title="Duplicate">⧉</button>
        <button class="btn-sm btn-danger action-del" data-idx="${i}">✕</button>
      </div>
      <div class="action-dynamic">${actionFields(a)}</div>
    </div>`;
}

function renderActions(e) {
  const list = document.getElementById('action-list');
  list.innerHTML = (e.actions || []).map((a, i) => renderActionRow(a, i)).join('')
    || '<div style="color:var(--text-muted);font-size:13px;">No actions.</div>';

  list.querySelectorAll('.action-row').forEach(row => wireSliders(row));

  list.querySelectorAll('.action-dup').forEach(btn =>
    btn.addEventListener('click', () => {
      const e = events.find(e => e.id === selectedId);
      syncActionsFromDOM(e);
      const idx = parseInt(btn.dataset.idx);
      e.actions.splice(idx + 1, 0, JSON.parse(JSON.stringify(e.actions[idx])));
      renderActions(e);
    })
  );

  list.querySelectorAll('.action-del').forEach(btn =>
    btn.addEventListener('click', () => {
      const e = events.find(e => e.id === selectedId);
      syncActionsFromDOM(e);
      e.actions.splice(parseInt(btn.dataset.idx), 1);
      renderActions(e);
    })
  );
}

// ── Sequence step body renderers ───────────────────────────────────────────
function renderStepEventBody(s) {
  return `<div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:12px;color:var(--text-muted);white-space:nowrap;">Event:</span>
    <div style="flex:1">${searchableSelect('step-event', eventOpts(selectedId), s?.event_id || '')}</div>
  </div>`;
}

function renderStepActionRow(a, i) {
  return `<div class="step-action-row" data-idx="${i}" data-type="${a.type}">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
      <select class="action-type" onchange="changeActionType(this)" style="min-width:0;flex:1;max-width:160px">${typeOptions(a.type)}</select>
      <input type="text" class="action-labels" value="${(a.labels||[]).join(', ')}" placeholder="labels" style="width:80px">
      <button class="btn-sm step-action-dup" data-idx="${i}" title="Duplicate">⧉</button>
      <button class="btn-sm btn-danger step-action-del" data-idx="${i}">✕</button>
    </div>
    <div class="action-dynamic">${actionFields(a)}</div>
  </div>`;
}

function renderStepActionBody(actions) {
  const list = (actions && actions.length) ? actions : [{ type: 'ledfx_scene' }];
  return `<div class="step-actions-list">
    ${list.map((a, i) => renderStepActionRow(a, i)).join('')}
    <button class="btn-sm btn-add-step-action" style="margin-top:4px">+ Action</button>
  </div>`;
}

function wireStepActionButtons(container, syncAndRerender) {
  // "+ Action" — append a default action to the step's actions list, then re-render
  container.querySelectorAll('.btn-add-step-action').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepRow = btn.closest('.step-row');
      const actionRows = [...stepRow.querySelectorAll('.step-action-row')];
      // Temporarily inject a new default action row so syncAndRerender picks it up
      const count = actionRows.length;
      btn.insertAdjacentHTML('beforebegin', renderStepActionRow({ type: 'ledfx_scene' }, count));
      syncAndRerender();
    });
  });
  // Dup — duplicate the action within its step
  container.querySelectorAll('.step-action-dup').forEach(btn => {
    btn.addEventListener('click', () => {
      const actionRow = btn.closest('.step-action-row');
      actionRow.insertAdjacentHTML('afterend', actionRow.outerHTML);
      syncAndRerender();
    });
  });
  // Del — remove the action from its step (keep at least one)
  container.querySelectorAll('.step-action-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const actionRow = btn.closest('.step-action-row');
      const stepRow = actionRow.closest('.step-row');
      if (stepRow.querySelectorAll('.step-action-row').length > 1) {
        actionRow.remove();
      }
      syncAndRerender();
    });
  });
}

function syncStepsFromDOM() {
  return [...document.querySelectorAll('#step-list .step-row')].map(row => {
    const step_type = row.querySelector('.step-type')?.value || 'event';
    const delay_ms = parseInt(row.querySelector('.step-delay')?.value) || 0;
    if (step_type === 'action') {
      const actionRows = [...row.querySelectorAll('.step-action-row')];
      const actions = actionRows.map(syncActionFromRow);
      return { step_type: 'action', actions, delay_ms, labels: [] };
    } else {
      return { step_type: 'event', event_id: row.querySelector('.step-event')?.value || '', delay_ms, labels: [] };
    }
  });
}

function moveStep(idx, dir) {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  e.sequence_steps = syncStepsFromDOM();
  const other = idx + dir;
  if (other < 0 || other >= e.sequence_steps.length) return;
  [e.sequence_steps[idx], e.sequence_steps[other]] = [e.sequence_steps[other], e.sequence_steps[idx]];
  renderSequence(e);
}

function renderSequence(e) {
  const durEl = document.getElementById('seq-dur');
  if (durEl) durEl.textContent = fmtDuration(calcEventDuration(e));
  const list = document.getElementById('step-list');
  const last = (e.sequence_steps || []).length - 1;
  list.innerHTML = (e.sequence_steps || []).map((s, i) => {
    const isAction = s.step_type === 'action';
    return `<div class="step-row" data-idx="${i}">
      <div class="step-header">
        <select class="step-type" onchange="changeStepType(this)">
          <option value="event"${!isAction ? ' selected' : ''}>Event</option>
          <option value="action"${isAction ? ' selected' : ''}>Action</option>
        </select>
        <span style="font-size:12px;color:var(--text-muted);">Delay</span>
        <input type="number" class="step-delay" value="${s.delay_ms ?? 0}" style="width:76px"> ms
        <button class="btn-sm step-up"   data-idx="${i}"${i === 0    ? ' disabled' : ''}>↑</button>
        <button class="btn-sm step-down" data-idx="${i}"${i === last  ? ' disabled' : ''}>↓</button>
        <button class="btn-sm step-dup" data-idx="${i}" title="Duplicate" style="margin-left:auto">⧉</button>
        <button class="btn-sm btn-danger step-del" data-idx="${i}">✕</button>
      </div>
      <div class="step-body" style="margin-top:4px;">
        ${isAction ? renderStepActionBody(s.actions?.length ? s.actions : (s.action ? [s.action] : null)) : renderStepEventBody(s)}
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--text-muted);font-size:13px;">No steps.</div>';

  list.querySelectorAll('.step-row').forEach(row => wireSliders(row));
  list.querySelectorAll('.step-up').forEach(btn =>
    btn.addEventListener('click', () => moveStep(parseInt(btn.dataset.idx), -1))
  );
  list.querySelectorAll('.step-down').forEach(btn =>
    btn.addEventListener('click', () => moveStep(parseInt(btn.dataset.idx), +1))
  );
  list.querySelectorAll('.step-dup').forEach(btn =>
    btn.addEventListener('click', () => {
      const e = events.find(e => e.id === selectedId);
      if (!e) return;
      e.sequence_steps = syncStepsFromDOM();
      const idx = parseInt(btn.dataset.idx);
      e.sequence_steps.splice(idx + 1, 0, JSON.parse(JSON.stringify(e.sequence_steps[idx])));
      renderSequence(e);
    })
  );

  list.querySelectorAll('.step-del').forEach(btn =>
    btn.addEventListener('click', () => {
      const e = events.find(e => e.id === selectedId);
      if (!e) return;
      e.sequence_steps = syncStepsFromDOM();
      e.sequence_steps.splice(parseInt(btn.dataset.idx), 1);
      renderSequence(e);
    })
  );

  wireStepActionButtons(list, () => {
    const e = events.find(e => e.id === selectedId);
    if (e) { e.sequence_steps = syncStepsFromDOM(); renderSequence(e); }
  });
}

// ── Beat Sequence helpers ───────────────────────────────────────────────────

function calcBeatCount(e) {
  const steps = e.beat_sequence_steps || [];
  if (!steps.length) return 0;
  let total = 1; // trigger beat (first step always occupies beat 1)
  for (let i = 1; i < steps.length; i++) total += 1 + (steps[i].delay_beats || 0);
  const rv = e.beat_revert;
  if (rv?.enabled) total += 1 + (rv.delay_beats || 0);
  return total;
}

function renderBeatStep(s, idx, last) {
  const isAction = s.step_type === 'action';
  const isFirst  = idx === 0;
  return `<div class="step-row" data-idx="${idx}">
    <div class="step-header">
      <select class="bs-step-type" onchange="changeBsStepType(this)">
        <option value="event"${!isAction ? ' selected' : ''}>Event</option>
        <option value="action"${isAction ? ' selected' : ''}>Action</option>
      </select>
      <span style="font-size:12px;color:var(--text-muted);">Delay</span>
      <input type="number" class="bs-step-delay" value="${s.delay_beats ?? 0}" min="0" style="width:52px"> beats
      <label style="font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;">
        <input type="checkbox" class="bs-step-pre-ramp"${s.pre_ramp !== false ? ' checked' : ''}> pre-ramp
      </label>
      <button class="btn-sm bs-step-up"   data-idx="${idx}"${isFirst   ? ' disabled' : ''}>↑</button>
      <button class="btn-sm bs-step-down" data-idx="${idx}"${idx===last ? ' disabled' : ''}>↓</button>
      <button class="btn-sm bs-step-dup" data-idx="${idx}" title="Duplicate" style="margin-left:auto">⧉</button>
      <button class="btn-sm btn-danger bs-step-del" data-idx="${idx}">✕</button>
    </div>
    <div class="step-body" style="margin-top:4px;">
      ${isAction ? renderStepActionBody(s.actions?.length ? s.actions : (s.action ? [s.action] : null)) : renderStepEventBody(s)}
    </div>
  </div>`;
}

function syncBsStepsFromDOM() {
  return [...document.querySelectorAll('#bs-step-list .step-row')].map(row => {
    const step_type  = row.querySelector('.bs-step-type')?.value || 'event';
    const delay_beats = parseInt(row.querySelector('.bs-step-delay')?.value) || 0;
    const pre_ramp   = row.querySelector('.bs-step-pre-ramp')?.checked !== false;
    if (step_type === 'action') {
      const actionRows = [...row.querySelectorAll('.step-action-row')];
      const actions = actionRows.map(syncActionFromRow);
      return { step_type: 'action', actions, delay_beats, pre_ramp, labels: [] };
    } else {
      return { step_type: 'event', event_id: row.querySelector('.step-event')?.value || '', delay_beats, pre_ramp, labels: [] };
    }
  });
}

function moveBsStep(idx, dir) {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  e.beat_sequence_steps = syncBsStepsFromDOM();
  const other = idx + dir;
  if (other < 0 || other >= e.beat_sequence_steps.length) return;
  [e.beat_sequence_steps[idx], e.beat_sequence_steps[other]] = [e.beat_sequence_steps[other], e.beat_sequence_steps[idx]];
  renderBeatSequence(e);
}

window.changeBsStepType = function(sel) {
  const row = sel.closest('.step-row');
  const body = row.querySelector('.step-body');
  if (sel.value === 'action') {
    body.innerHTML = renderStepActionBody(null);
    wireSliders(row);
    wireStepActionButtons(row, () => {
      const ev = events.find(e => e.id === selectedId);
      if (ev) { ev.beat_sequence_steps = syncBsStepsFromDOM(); renderBeatSequence(ev); }
    });
  } else {
    body.innerHTML = renderStepEventBody(null);
  }
};

function renderBeatSequence(e) {
  const bc = calcBeatCount(e);
  const bcEl = document.getElementById('bs-beat-count');
  if (bcEl) bcEl.textContent = bc > 0 ? `${bc} beat${bc !== 1 ? 's' : ''}` : '';
  document.getElementById('bs-fallback').value = e.beat_sequence_fallback || 'fallback';
  document.getElementById('bs-start-offset').value = e.beat_sequence_start_offset_ms ?? 0;

  const list = document.getElementById('bs-step-list');
  const steps = e.beat_sequence_steps || [];
  const last = steps.length - 1;
  list.innerHTML = steps.map((s, i) => renderBeatStep(s, i, last)).join('')
    || '<div style="color:var(--text-muted);font-size:13px;">No steps.</div>';

  list.querySelectorAll('.step-row').forEach(row => wireSliders(row));
  list.querySelectorAll('.bs-step-up').forEach(btn =>
    btn.addEventListener('click', () => moveBsStep(parseInt(btn.dataset.idx), -1))
  );
  list.querySelectorAll('.bs-step-down').forEach(btn =>
    btn.addEventListener('click', () => moveBsStep(parseInt(btn.dataset.idx), +1))
  );
  list.querySelectorAll('.bs-step-dup').forEach(btn =>
    btn.addEventListener('click', () => {
      const ev = events.find(e => e.id === selectedId);
      if (!ev) return;
      ev.beat_sequence_steps = syncBsStepsFromDOM();
      const idx = parseInt(btn.dataset.idx);
      ev.beat_sequence_steps.splice(idx + 1, 0, JSON.parse(JSON.stringify(ev.beat_sequence_steps[idx])));
      renderBeatSequence(ev);
    })
  );
  list.querySelectorAll('.bs-step-del').forEach(btn =>
    btn.addEventListener('click', () => {
      const ev = events.find(e => e.id === selectedId);
      if (!ev) return;
      ev.beat_sequence_steps = syncBsStepsFromDOM();
      ev.beat_sequence_steps.splice(parseInt(btn.dataset.idx), 1);
      renderBeatSequence(ev);
    })
  );

  wireStepActionButtons(list, () => {
    const ev = events.find(e => e.id === selectedId);
    if (ev) { ev.beat_sequence_steps = syncBsStepsFromDOM(); renderBeatSequence(ev); }
  });
}

function readBsRevertFromDOM() {
  if (!document.getElementById('bs-revert-en').checked) return null;
  return {
    enabled: true,
    delay_beats: parseInt(document.getElementById('bs-revert-delay').value) || 0,
    transition_ms: parseInt(document.getElementById('bs-revert-transition').value) ?? 500,
    pre_ramp: document.getElementById('bs-revert-pre-ramp').checked,
  };
}

function loadBsRevertIntoDOM(revert) {
  const en = revert?.enabled === true;
  document.getElementById('bs-revert-en').checked = en;
  document.getElementById('bs-revert-opts').style.display = en ? '' : 'none';
  document.getElementById('bs-revert-delay').value = revert?.delay_beats ?? 0;
  document.getElementById('bs-revert-transition').value = revert?.transition_ms ?? 500;
  document.getElementById('bs-revert-pre-ramp').checked = revert?.pre_ramp !== false;
}

document.getElementById('bs-revert-en').addEventListener('change', function () {
  document.getElementById('bs-revert-opts').style.display = this.checked ? '' : 'none';
});

document.getElementById('btn-add-bs-step').addEventListener('click', () => {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  e.beat_sequence_steps = e.beat_sequence_steps || [];
  const other = events.find(ev => ev.id !== selectedId);
  e.beat_sequence_steps.push({ step_type: 'event', event_id: other?.id || '', delay_beats: 0, pre_ramp: true, labels: [] });
  renderBeatSequence(e);
});

// ── Duration helpers ────────────────────────────────────────────────────────
function calcEventDuration(event, visited = new Set()) {
  if (!event || visited.has(event.id)) return 0;
  const v2 = new Set(visited); v2.add(event.id);
  const evMap = Object.fromEntries(events.map(e => [e.id, e]));
  const defaultRamp = appSettings.smooth_ramp_ms ?? 500;
  if (event.event_type === 'single') {
    const ramps = (event.actions || []).filter(a => _RAMP_TYPES.has(a.type)).map(a => a.ramp_ms ?? defaultRamp);
    return ramps.length ? Math.max(...ramps) : 0;
  }
  let total = 0;
  for (const step of (event.sequence_steps || [])) {
    total += step.delay_ms || 0;
    if (step.step_type === 'action' && step.action && _RAMP_TYPES.has(step.action.type))
      total += step.action.ramp_ms ?? defaultRamp;
    else if (step.step_type === 'event' && step.event_id) {
      const sub = evMap[step.event_id];
      if (sub) total += calcEventDuration(sub, v2);
    }
  }
  return total;
}

function fmtDuration(ms) {
  if (!ms) return '';
  return ms >= 1000 ? `~${(ms / 1000).toFixed(1)}s` : `~${ms}ms`;
}

// ── List ───────────────────────────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('event-search').value.toLowerCase();
  const filtered = events.filter(e =>
    (!typeFilter || e.event_type === typeFilter) &&
    (!aiExFilter || e.ai_exposed) &&
    (e.name.toLowerCase().includes(q) ||
    (e.labels || []).some(l => l.toLowerCase().includes(q)))
  );
  const rows = filtered.map(e => {
    const dur = calcEventDuration(e);
    return `
    <div class="event-row${e.id === selectedId ? ' selected' : ''}" data-id="${e.id}">
      <div style="width:12px;height:12px;border-radius:50%;background:${e.color || '#888'};flex-shrink:0;"></div>
      <div>
        <div style="font-size:13px;font-weight:500;">${e.name}${dur ? ` <span style="font-size:11px;font-weight:400;opacity:0.5;">${fmtDuration(dur)}</span>` : ''}</div>
        <div style="font-size:11px;color:var(--text-muted);">${(e.labels||[]).join(', ')}</div>
      </div>
      <span style="margin-left:auto;display:flex;align-items:center;gap:4px;">
        <span style="font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;${
          e.event_type === 'single' ? 'background:rgba(33,150,243,0.15);color:#2196f3;' :
          e.event_type === 'sequence' ? 'background:rgba(255,152,0,0.15);color:#ff9800;' :
          'background:rgba(156,39,176,0.15);color:#ce93d8;'
        }">${e.event_type === 'beat_sequence' ? 'beat' : e.event_type}</span>
        ${e.energy_level != null ? `<span style="font-size:10px;color:var(--text-muted);">E${e.energy_level}</span>` : ''}
        ${e.ai_exposed ? '<span style="font-size:10px;color:#7c4dff;" title="Exposed to AI">AI</span>' : ''}
      </span>
    </div>
  `;
  }).join('');
  const emptyHtml = events.length === 0
    ? `<div style="color:var(--text-muted);font-size:13px;margin-bottom:8px;">No events yet.</div>
       <button id="btn-seed" class="btn-accent btn-sm">Create default LedFX event</button>`
    : filtered.length === 0 ? '<div style="color:var(--text-muted);font-size:13px;">No matches.</div>' : '';
  document.getElementById('event-list').innerHTML = rows + emptyHtml;

  document.querySelectorAll('.event-row').forEach(row => {
    row.addEventListener('click', () => selectEvent(row.dataset.id));
  });
  document.getElementById('btn-seed')?.addEventListener('click', seedDefaultEvent);
}

document.getElementById('event-search').addEventListener('input', renderList);

// Filter buttons
document.getElementById('filter-single').addEventListener('click', () => {
  typeFilter = typeFilter === 'single' ? null : 'single';
  document.getElementById('filter-single').classList.toggle('btn-accent', typeFilter === 'single');
  document.getElementById('filter-sequence').classList.remove('btn-accent');
  document.getElementById('filter-beat-seq').classList.remove('btn-accent');
  renderList();
});
document.getElementById('filter-sequence').addEventListener('click', () => {
  typeFilter = typeFilter === 'sequence' ? null : 'sequence';
  document.getElementById('filter-sequence').classList.toggle('btn-accent', typeFilter === 'sequence');
  document.getElementById('filter-single').classList.remove('btn-accent');
  document.getElementById('filter-beat-seq').classList.remove('btn-accent');
  renderList();
});
document.getElementById('filter-beat-seq').addEventListener('click', () => {
  typeFilter = typeFilter === 'beat_sequence' ? null : 'beat_sequence';
  document.getElementById('filter-beat-seq').classList.toggle('btn-accent', typeFilter === 'beat_sequence');
  document.getElementById('filter-single').classList.remove('btn-accent');
  document.getElementById('filter-sequence').classList.remove('btn-accent');
  renderList();
});
function setAiExposedBtn(active) {
  const btn = document.getElementById('e-ai-exposed-btn');
  btn.dataset.active = active ? 'true' : 'false';
  btn.style.background    = active ? 'var(--accent)'      : 'var(--surface)';
  btn.style.color         = active ? '#fff'               : 'var(--text-muted)';
  btn.style.borderColor   = active ? 'var(--accent)'      : 'var(--border)';
}
window.toggleAiExposed = function() {
  const btn = document.getElementById('e-ai-exposed-btn');
  setAiExposedBtn(btn.dataset.active !== 'true');
  document.getElementById('btn-save').click();
};

document.getElementById('filter-ai-ex').addEventListener('click', () => {
  aiExFilter = !aiExFilter;
  document.getElementById('filter-ai-ex').classList.toggle('btn-accent', aiExFilter);
  renderList();
});

// ── Editor ─────────────────────────────────────────────────────────────────
function selectEvent(id) {
  selectedId = id;
  const e = events.find(e => e.id === id);
  if (!e) return;
  document.getElementById('editor').classList.add('open');
  document.getElementById('e-name').value = e.name;
  document.getElementById('e-color').value = e.color || '#FFD700';
  document.getElementById('e-labels').value = (e.labels || []).join(', ');
  document.getElementById('e-type').value = e.event_type;
  setAiExposedBtn(!!e.ai_exposed);
  // Energy level
  const en = e.energy_level != null;
  document.getElementById('e-energy-en').checked = en;
  document.getElementById('e-energy-val').disabled = !en;
  document.getElementById('e-energy-val').value = e.energy_level ?? 5;
  document.getElementById('e-energy-display').textContent = e.energy_level ?? 5;
  // Pre-brightness
  const pbEn = e.pre_brightness_enabled !== false;
  document.getElementById('e-pre-brightness-en').checked = pbEn;
  document.getElementById('e-pre-brightness-val').disabled = !pbEn;
  document.getElementById('e-pre-brightness-val').value = e.pre_brightness_value ?? 1.0;
  document.getElementById('e-pre-brightness-display').textContent =
    Math.round((e.pre_brightness_value ?? 1.0) * 100) + '%';
  // Pre-transition
  const ptEn = e.pre_transition_enabled !== false;
  document.getElementById('e-pre-transition-en').checked = ptEn;
  document.getElementById('e-pre-transition-val').disabled = !ptEn;
  document.getElementById('e-pre-transition-val').value = e.pre_transition_value ?? 0.5;
  document.getElementById('e-pre-transition-display').textContent =
    (e.pre_transition_value ?? 0.5).toFixed(1) + 's';
  // Pre-brightness ramp
  const rampInput = document.getElementById('e-pre-brightness-ramp');
  rampInput.value = e.pre_brightness_ramp_ms != null ? e.pre_brightness_ramp_ms : '';
  document.getElementById('e-offset').value = e.event_offset_ms ?? 0;
  renderActions(e);
  renderSequence(e);
  loadRevertIntoDOM(e.revert);
  renderBeatSequence(e);
  loadBsRevertIntoDOM(e.beat_revert);
  toggleSections(e.event_type);
  renderList();
}

document.getElementById('e-type').addEventListener('change', () => {
  toggleSections(document.getElementById('e-type').value);
});

function toggleSections(type) {
  document.getElementById('actions-section').style.display = type === 'single' ? '' : 'none';
  document.getElementById('sequence-section').style.display = type === 'sequence' ? '' : 'none';
  document.getElementById('beat-sequence-section').style.display = type === 'beat_sequence' ? '' : 'none';
  document.getElementById('single-pre-commands').style.display = '';
}

// Energy level controls
document.getElementById('e-energy-en').addEventListener('change', () => {
  const enabled = document.getElementById('e-energy-en').checked;
  document.getElementById('e-energy-val').disabled = !enabled;
});
document.getElementById('e-energy-val').addEventListener('input', () => {
  document.getElementById('e-energy-display').textContent = document.getElementById('e-energy-val').value;
});
document.getElementById('e-pre-brightness-en').addEventListener('change', () => {
  document.getElementById('e-pre-brightness-val').disabled =
    !document.getElementById('e-pre-brightness-en').checked;
});
document.getElementById('e-pre-brightness-val').addEventListener('input', () => {
  document.getElementById('e-pre-brightness-display').textContent =
    Math.round(parseFloat(document.getElementById('e-pre-brightness-val').value) * 100) + '%';
});
document.getElementById('e-pre-transition-en').addEventListener('change', () => {
  document.getElementById('e-pre-transition-val').disabled =
    !document.getElementById('e-pre-transition-en').checked;
});
document.getElementById('e-pre-transition-val').addEventListener('input', () => {
  document.getElementById('e-pre-transition-display').textContent =
    parseFloat(document.getElementById('e-pre-transition-val').value).toFixed(1) + 's';
});

document.getElementById('btn-add-action').addEventListener('click', () => {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  syncActionsFromDOM(e);
  e.actions = e.actions || [];
  e.actions.push({ type: 'event_ref', event_id: events.find(ev => ev.id !== selectedId)?.id || '', weight: 1, labels: [] });
  renderActions(e);
});

// ── Revert helpers ──────────────────────────────────────────────────────────
document.getElementById('revert-en').addEventListener('change', function () {
  document.getElementById('revert-opts').style.display = this.checked ? '' : 'none';
});

function readRevertFromDOM() {
  if (!document.getElementById('revert-en').checked) return null;
  return {
    enabled: true,
    delay_ms: parseInt(document.getElementById('revert-delay').value) || 0,
    transition_ms: parseInt(document.getElementById('revert-transition').value) ?? 500,
  };
}

function loadRevertIntoDOM(revert) {
  const en = revert?.enabled === true;
  document.getElementById('revert-en').checked = en;
  document.getElementById('revert-opts').style.display = en ? '' : 'none';
  document.getElementById('revert-delay').value = revert?.delay_ms ?? 0;
  document.getElementById('revert-transition').value = revert?.transition_ms ?? 500;
}

document.getElementById('btn-add-step').addEventListener('click', () => {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  e.sequence_steps = e.sequence_steps || [];
  const other = events.find(ev => ev.id !== selectedId);
  e.sequence_steps.push({ step_type: 'event', event_id: other?.id || '', delay_ms: 0, labels: [] });
  renderSequence(e);
});

// ── Save ───────────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  const e = events.find(e => e.id === selectedId);
  if (!e) return;
  e.name = document.getElementById('e-name').value;
  e.color = document.getElementById('e-color').value;
  e.labels = document.getElementById('e-labels').value.split(',').map(s => s.trim()).filter(Boolean);
  e.event_type = document.getElementById('e-type').value;
  e.ai_exposed  = document.getElementById('e-ai-exposed-btn').dataset.active === 'true';
  const energyEn = document.getElementById('e-energy-en').checked;
  e.energy_level = energyEn ? parseInt(document.getElementById('e-energy-val').value) : null;

  // Pre-commands apply to all event types
  e.pre_brightness_enabled = document.getElementById('e-pre-brightness-en').checked;
  e.pre_brightness_value    = parseFloat(document.getElementById('e-pre-brightness-val').value);
  e.pre_transition_enabled  = document.getElementById('e-pre-transition-en').checked;
  e.pre_transition_value    = parseFloat(document.getElementById('e-pre-transition-val').value);
  const rampStr = document.getElementById('e-pre-brightness-ramp').value;
  e.pre_brightness_ramp_ms = rampStr !== '' ? parseInt(rampStr) : null;
  e.event_offset_ms = parseInt(document.getElementById('e-offset').value) || 0;

  if (e.event_type === 'single') {
    syncActionsFromDOM(e);
  } else if (e.event_type === 'sequence') {
    e.sequence_steps = syncStepsFromDOM();
    e.revert = readRevertFromDOM();
  } else if (e.event_type === 'beat_sequence') {
    e.beat_sequence_steps = syncBsStepsFromDOM();
    e.beat_revert = readBsRevertFromDOM();
    e.beat_sequence_fallback = document.getElementById('bs-fallback').value;
    e.beat_sequence_start_offset_ms = parseInt(document.getElementById('bs-start-offset').value) || 0;
  }

  await POST('/events', e);
  renderList();
  if (e.event_type === 'beat_sequence') renderBeatSequence(e);
});

// ── Delete ─────────────────────────────────────────────────────────────────
document.getElementById('btn-delete').addEventListener('click', async () => {
  if (!selectedId || !confirm('Delete this event?')) return;
  await DEL(`/events/${selectedId}`);
  events = events.filter(e => e.id !== selectedId);
  selectedId = null;
  document.getElementById('editor').classList.remove('open');
  renderList();
});

// ── Duplicate ──────────────────────────────────────────────────────────────
document.getElementById('btn-duplicate').addEventListener('click', async () => {
  const src = events.find(e => e.id === selectedId);
  if (!src) return;
  // Save current state first so the copy reflects any unsaved edits
  src.name = document.getElementById('e-name').value;
  src.color = document.getElementById('e-color').value;
  src.labels = document.getElementById('e-labels').value.split(',').map(s => s.trim()).filter(Boolean);
  src.event_type = document.getElementById('e-type').value;
  src.energy_level = document.getElementById('e-energy-en').checked
    ? parseInt(document.getElementById('e-energy-val').value) : null;
  src.event_offset_ms = parseInt(document.getElementById('e-offset').value) || 0;
  if (src.event_type === 'single') {
    syncActionsFromDOM(src);
    src.pre_brightness_enabled = document.getElementById('e-pre-brightness-en').checked;
    src.pre_brightness_value   = parseFloat(document.getElementById('e-pre-brightness-val').value);
    src.pre_transition_enabled = document.getElementById('e-pre-transition-en').checked;
    src.pre_transition_value   = parseFloat(document.getElementById('e-pre-transition-val').value);
    const rampStr = document.getElementById('e-pre-brightness-ramp').value;
    src.pre_brightness_ramp_ms = rampStr !== '' ? parseInt(rampStr) : null;
  } else if (src.event_type === 'sequence') {
    src.sequence_steps = syncStepsFromDOM();
    src.revert = readRevertFromDOM();
  } else if (src.event_type === 'beat_sequence') {
    src.beat_sequence_steps = syncBsStepsFromDOM();
    src.beat_revert = readBsRevertFromDOM();
    src.beat_sequence_fallback = document.getElementById('bs-fallback').value;
  }
  await POST('/events', src);

  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uuid();
  copy.name = src.name + ' - Copy';
  events.push(copy);
  await POST('/events', copy);
  selectEvent(copy.id);
});

// ── Fire ───────────────────────────────────────────────────────────────────
document.getElementById('btn-fire').addEventListener('click', async () => {
  if (!selectedId) return;
  const btn = document.getElementById('btn-fire');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await POST(`/events/${selectedId}/fire`, {});
    btn.textContent = '✓ Fired';
  } catch {
    btn.textContent = '✕ Failed';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = '▶ Fire'; }, 1500);
});

// ── Wire top action bar buttons to delegate to bottom bar ────────────────
document.querySelectorAll('.action-save').forEach(btn => {
  if (btn.id) return; // skip the primary (already wired)
  btn.addEventListener('click', () => document.getElementById('btn-save').click());
});
document.querySelectorAll('.action-delete').forEach(btn => {
  if (btn.id) return;
  btn.addEventListener('click', () => document.getElementById('btn-delete').click());
});
document.querySelectorAll('.action-duplicate').forEach(btn => {
  if (btn.id) return;
  btn.addEventListener('click', () => document.getElementById('btn-duplicate').click());
});
document.querySelectorAll('.action-fire').forEach(btn => {
  if (btn.id) return;
  btn.addEventListener('click', () => document.getElementById('btn-fire').click());
});

// ── Seed default event ─────────────────────────────────────────────────────
async function seedDefaultEvent() {
  const firstScene = scenes[0];
  const e = {
    id: uuid(),
    name: 'LedFX Scene',
    event_type: 'single',
    color: '#1db954',
    labels: [],
    energy_level: null,
    actions: firstScene
      ? [{ type: 'ledfx_scene', scene_id: firstScene.id, weight: 1, labels: [] }]
      : [],
    sequence_steps: [],
  };
  events.push(e);
  await POST('/events', e);
  selectEvent(e.id);
}

// ── New ────────────────────────────────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', async () => {
  const e = { id: uuid(), name: 'New Event', event_type: 'single', color: '#FFD700', labels: [], energy_level: null, pre_brightness_enabled: true, pre_brightness_value: 1.0, pre_brightness_ramp_ms: null, pre_transition_enabled: true, pre_transition_value: 0.5, actions: [], sequence_steps: [], beat_sequence_steps: [], beat_revert: null, beat_sequence_fallback: 'fallback' };
  events.push(e);
  await POST('/events', e);
  selectEvent(e.id);
});
