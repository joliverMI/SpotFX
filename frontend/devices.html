<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotFX — Devices</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .cat-row { display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius); cursor:pointer; }
    .cat-row:hover { background:var(--surface2); }
    .cat-row.selected { background:var(--surface2); border-left:3px solid var(--accent); padding-left:7px; }
    .cat-row .cat-badge { font-size:11px; color:var(--text-muted); margin-left:auto; }
    .cat-row.child { padding-left:24px; }
    .editor { display:none; }
    .editor.open { display:block; }
    .chip-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .chip { display:inline-flex; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:3px 10px; font-size:12px; }
    .chip .chip-x { cursor:pointer; color:var(--text-muted); font-weight:bold; }
    .chip .chip-x:hover { color:var(--danger); }
    .add-row { display:flex; gap:6px; margin-top:6px; }
    .add-row input, .add-row select { flex:1; min-width:0; }
    .import-panel { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-top:8px; }
    .import-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .import-row:last-child { border-bottom:none; }
    .import-row label { display:flex; align-items:center; gap:6px; cursor:pointer; flex:1; }
    .import-row .import-effect { color:var(--text-muted); font-size:11px; }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="nav-root"></div>

  <main>
    <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;">
      <!-- ── Category list ──────────────────────────────────────────────── -->
      <div class="card" style="min-width:0;max-height:calc(100vh - 80px);display:flex;flex-direction:column;">
        <div class="card-title" style="display:flex;align-items:center;">
          Device Categories
          <button class="btn-sm btn-accent" id="btn-new" style="margin-left:auto">+ New</button>
        </div>
        <div class="field">
          <input id="cat-search" type="text" placeholder="Search categories…">
        </div>
        <div id="cat-list" style="overflow-y:auto;flex:1;min-height:0;"></div>
      </div>

      <!-- ── Editor ────────────────────────────────────────────────────── -->
      <div class="card editor" id="editor" style="max-height:calc(100vh - 80px);overflow-y:auto;">
        <div class="card-title">Edit Category</div>
        <div class="event-action-bar" style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <button class="btn-accent action-save">Save</button>
          <button class="btn-danger btn-sm action-delete">Delete</button>
          <button class="btn-sm action-duplicate">Duplicate</button>
        </div>

        <div class="field">
          <label>Name</label>
          <input id="c-name" type="text" placeholder="Category name">
        </div>

        <div class="field" style="display:flex;gap:12px;">
          <div style="flex:1;">
            <label>Parent Category</label>
            <select id="c-parent"></select>
          </div>
          <div style="width:140px;">
            <label>Role</label>
            <select id="c-role">
              <option value="">(none)</option>
              <option value="ambient">Ambient</option>
            </select>
          </div>
        </div>

        <!-- Virtuals -->
        <div class="field">
          <label>Virtuals (LedFX virtual IDs)</label>
          <div id="c-virtuals" class="chip-list"></div>
          <div class="add-row">
            <input id="c-virtual-input" type="text" placeholder="Virtual ID…">
            <button class="btn-sm" id="btn-add-virtual">+ Add</button>
            <button class="btn-sm btn-accent" id="btn-import-ledfx">Import from LedFX</button>
          </div>
          <div id="import-panel" class="import-panel" style="display:none;">
            <div style="display:flex;align-items:center;margin-bottom:8px;">
              <strong style="font-size:13px;">Select virtuals to import</strong>
              <button class="btn-sm" id="btn-import-close" style="margin-left:auto;">Close</button>
            </div>
            <input id="import-search" type="text" placeholder="Filter virtuals…" style="margin-bottom:8px;width:100%;">
            <div id="import-list" style="max-height:300px;overflow-y:auto;"></div>
            <button class="btn-sm btn-accent" id="btn-import-add" style="margin-top:8px;">Add Selected</button>
          </div>
        </div>

        <!-- Effects -->
        <div class="field">
          <label>Supported Effects</label>
          <div id="c-effects" class="chip-list"></div>
          <div class="add-row">
            <select id="c-effect-select"><option value="">Select effect…</option></select>
            <button class="btn-sm" id="btn-add-effect">+ Add</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { GET, POST, DEL, connectWS, uuid } from '/static/js/app.js';
import { initNav } from '/static/js/nav.js';
initNav();
connectWS();

let categories = [];
let selectedId = null;
let allEffectTypes = [];  // loaded from effect_params

// ── Load data ──────────────────────────────────────────────────────────────

async function load() {
  categories = await GET('/device-categories');
  // Load available effect types from effect_params config
  try {
    const ep = await GET('/effect-params/config');
    if (ep?.effects) allEffectTypes = Object.keys(ep.effects);
  } catch { /* fallback empty */ }
  renderList();
  if (selectedId) {
    const still = categories.find(c => c.id === selectedId);
    if (still) selectCategory(selectedId);
    else closeEditor();
  }
}

// ── List rendering ─────────────────────────────────────────────────────────

function renderList() {
  const search = document.getElementById('cat-search').value.toLowerCase();
  // Build tree: top-level first, then children
  const topLevel = categories.filter(c => !c.parent_id).sort((a,b) => a.sort_order - b.sort_order);
  const byParent = {};
  categories.forEach(c => {
    if (c.parent_id) {
      (byParent[c.parent_id] = byParent[c.parent_id] || []).push(c);
    }
  });

  let html = '';
  function renderNode(cat, isChild) {
    if (search && !cat.name.toLowerCase().includes(search)) return;
    const sel = cat.id === selectedId ? ' selected' : '';
    const childCls = isChild ? ' child' : '';
    html += `<div class="cat-row${sel}${childCls}" data-id="${cat.id}">
      <span>${cat.name}</span>
      <span class="cat-badge">${cat.virtuals.length} virtual${cat.virtuals.length !== 1 ? 's' : ''}</span>
    </div>`;
    (byParent[cat.id] || []).sort((a,b) => a.sort_order - b.sort_order).forEach(child => renderNode(child, true));
  }
  topLevel.forEach(c => renderNode(c, false));

  const list = document.getElementById('cat-list');
  list.innerHTML = html || '<div style="color:var(--text-muted);padding:12px;font-size:13px;">No categories yet</div>';
  list.querySelectorAll('.cat-row').forEach(row => {
    row.addEventListener('click', () => selectCategory(row.dataset.id));
  });
}

// ── Editor ─────────────────────────────────────────────────────────────────

function selectCategory(id) {
  selectedId = id;
  const cat = categories.find(c => c.id === id);
  if (!cat) return;

  document.getElementById('c-name').value = cat.name;
  document.getElementById('c-role').value = cat.role || '';
  renderParentDropdown(cat);
  renderVirtuals(cat.virtuals);
  renderEffects(cat.effects);
  renderEffectSelect(cat.effects);

  document.getElementById('editor').classList.add('open');
  renderList(); // refresh selection highlight
}

function closeEditor() {
  selectedId = null;
  document.getElementById('editor').classList.remove('open');
  document.getElementById('import-panel').style.display = 'none';
  renderList();
}

function renderParentDropdown(cat) {
  const descendants = getDescendantIds(cat.id);
  let html = '<option value="">(None — top level)</option>';
  categories.forEach(c => {
    if (c.id === cat.id || descendants.has(c.id)) return;
    const sel = c.id === cat.parent_id ? ' selected' : '';
    html += `<option value="${c.id}"${sel}>${c.name}</option>`;
  });
  document.getElementById('c-parent').innerHTML = html;
}

function getDescendantIds(id) {
  const result = new Set();
  function walk(parentId) {
    categories.filter(c => c.parent_id === parentId).forEach(c => {
      result.add(c.id);
      walk(c.id);
    });
  }
  walk(id);
  return result;
}

// ── Virtuals chips ─────────────────────────────────────────────────────────

function renderVirtuals(virtuals) {
  const el = document.getElementById('c-virtuals');
  el.innerHTML = virtuals.map(v =>
    `<span class="chip">${v}<span class="chip-x" data-v="${v}">&times;</span></span>`
  ).join('');
  el.querySelectorAll('.chip-x').forEach(x => {
    x.addEventListener('click', () => {
      const cat = categories.find(c => c.id === selectedId);
      if (!cat) return;
      cat.virtuals = cat.virtuals.filter(vid => vid !== x.dataset.v);
      renderVirtuals(cat.virtuals);
    });
  });
}

// ── Effects chips ──────────────────────────────────────────────────────────

function renderEffects(effects) {
  const el = document.getElementById('c-effects');
  el.innerHTML = effects.map(e =>
    `<span class="chip">${e}<span class="chip-x" data-e="${e}">&times;</span></span>`
  ).join('');
  el.querySelectorAll('.chip-x').forEach(x => {
    x.addEventListener('click', () => {
      const cat = categories.find(c => c.id === selectedId);
      if (!cat) return;
      cat.effects = cat.effects.filter(eff => eff !== x.dataset.e);
      renderEffects(cat.effects);
      renderEffectSelect(cat.effects);
    });
  });
}

function renderEffectSelect(currentEffects) {
  const sel = document.getElementById('c-effect-select');
  let html = '<option value="">Select effect…</option>';
  allEffectTypes.filter(e => !currentEffects.includes(e)).forEach(e => {
    html += `<option value="${e}">${e}</option>`;
  });
  sel.innerHTML = html;
}

// ── Import from LedFX ──────────────────────────────────────────────────────

let _importVirtuals = [];  // cached for search filtering

async function openImport() {
  const panel = document.getElementById('import-panel');
  const list = document.getElementById('import-list');
  const search = document.getElementById('import-search');
  panel.style.display = '';
  search.value = '';
  list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">Loading…</div>';

  try {
    const data = await GET('/device-categories/import/ledfx-virtuals');
    _importVirtuals = data.virtuals || [];
    renderImportList();
  } catch (err) {
    list.innerHTML = `<div style="color:var(--danger);font-size:12px;">Failed to fetch: ${err.message || err}</div>`;
  }
}

function renderImportList() {
  const list = document.getElementById('import-list');
  const filter = (document.getElementById('import-search')?.value || '').toLowerCase();
  const currentCat = categories.find(c => c.id === selectedId);
  const currentVirtuals = currentCat ? currentCat.virtuals : [];

  // Build a map of virtual ID → category names
  const assignedTo = {};
  categories.forEach(c => c.virtuals.forEach(vid => {
    (assignedTo[vid] = assignedTo[vid] || []).push(c.name);
  }));

  // Merge LedFX virtuals with any already-categorized IDs not in LedFX
  const ledfxIds = new Set(_importVirtuals.map(v => v.id));
  const allVirtuals = [..._importVirtuals];
  // Add virtuals from categories that aren't in LedFX
  const allCatVirtuals = new Set(categories.flatMap(c => c.virtuals));
  allCatVirtuals.forEach(vid => {
    if (!ledfxIds.has(vid)) allVirtuals.push({ id: vid, pixel_count: 0, effect_type: '', active: false });
  });

  const filtered = filter ? allVirtuals.filter(v => v.id.toLowerCase().includes(filter)) : allVirtuals;

  if (!filtered.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">No matches</div>';
    return;
  }

  list.innerHTML = filtered.map(v => {
    const inCurrent = currentVirtuals.includes(v.id);
    const catNames = assignedTo[v.id];
    const hint = catNames ? `[${catNames.join(', ')}]` : '';
    const inLedfx = ledfxIds.has(v.id);
    const details = inLedfx
      ? `${v.pixel_count ? `${v.pixel_count}px` : ''}${v.effect_type ? ` · ${v.effect_type}` : ''}${v.active ? ' · active' : ''}`
      : '(not in LedFX)';
    return `<div class="import-row">
      <label>
        <input type="checkbox" value="${v.id}" ${inCurrent ? 'checked disabled' : ''}>
        <span>${v.id}</span>
        <span class="import-effect">${details}</span>
        ${hint ? `<span class="import-effect">${hint}</span>` : ''}
      </label>
    </div>`;
  }).join('');
}

function addImported() {
  const cat = categories.find(c => c.id === selectedId);
  if (!cat) return;
  const checkboxes = document.querySelectorAll('#import-list input[type=checkbox]:checked:not(:disabled)');
  checkboxes.forEach(cb => {
    if (!cat.virtuals.includes(cb.value)) cat.virtuals.push(cb.value);
  });
  renderVirtuals(cat.virtuals);
  document.getElementById('import-panel').style.display = 'none';
}

// ── CRUD ────────────────────────────────────────────────────────────────────

function readFromDOM() {
  const cat = categories.find(c => c.id === selectedId);
  if (!cat) return null;
  cat.name = document.getElementById('c-name').value.trim() || 'Untitled';
  cat.parent_id = document.getElementById('c-parent').value || null;
  cat.role = document.getElementById('c-role').value || null;
  return cat;
}

async function save() {
  const cat = readFromDOM();
  if (!cat) return;
  await POST('/device-categories', cat);
  await load();
}

async function remove() {
  if (!selectedId) return;
  if (!confirm('Delete this category? Child categories will become top-level.')) return;
  await DEL(`/device-categories/${selectedId}`);
  closeEditor();
  await load();
}

async function duplicate() {
  const cat = readFromDOM();
  if (!cat) return;
  // Save current first
  await POST('/device-categories', cat);
  // Create copy
  const copy = { ...cat };
  copy.id = uuid();
  copy.name = cat.name + ' (copy)';
  await POST('/device-categories', copy);
  selectedId = copy.id;
  await load();
}

// ── Wire up events ─────────────────────────────────────────────────────────

document.getElementById('btn-new').addEventListener('click', async () => {
  const maxOrder = categories.reduce((m, c) => Math.max(m, c.sort_order), -1);
  const cat = { id: uuid(), name: 'New Category', parent_id: null, virtuals: [], effects: [], sort_order: maxOrder + 1 };
  await POST('/device-categories', cat);
  selectedId = cat.id;
  await load();
});

document.querySelectorAll('.action-save').forEach(b => b.addEventListener('click', save));
document.querySelectorAll('.action-delete').forEach(b => b.addEventListener('click', remove));
document.querySelectorAll('.action-duplicate').forEach(b => b.addEventListener('click', duplicate));

document.getElementById('btn-add-virtual').addEventListener('click', () => {
  const input = document.getElementById('c-virtual-input');
  const val = input.value.trim();
  if (!val) return;
  const cat = categories.find(c => c.id === selectedId);
  if (!cat) return;
  if (!cat.virtuals.includes(val)) cat.virtuals.push(val);
  renderVirtuals(cat.virtuals);
  input.value = '';
});

document.getElementById('c-virtual-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-virtual').click(); }
});

document.getElementById('btn-add-effect').addEventListener('click', () => {
  const sel = document.getElementById('c-effect-select');
  const val = sel.value;
  if (!val) return;
  const cat = categories.find(c => c.id === selectedId);
  if (!cat) return;
  if (!cat.effects.includes(val)) cat.effects.push(val);
  renderEffects(cat.effects);
  renderEffectSelect(cat.effects);
});

document.getElementById('btn-import-ledfx').addEventListener('click', openImport);
document.getElementById('btn-import-close').addEventListener('click', () => {
  document.getElementById('import-panel').style.display = 'none';
});
document.getElementById('import-search').addEventListener('input', renderImportList);
document.getElementById('btn-import-add').addEventListener('click', addImported);

document.getElementById('cat-search').addEventListener('input', renderList);

// ── Init ────────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
